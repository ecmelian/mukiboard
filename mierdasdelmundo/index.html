<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="mierdasdelmundo — capture, timestamp and map the dog poops of the world's big cities. Take a picture, flick the bag, fill your Mierdex.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mierdasdelmundo">
<title>mierdasdelmundo</title>
<script>
// Image fallbacks (defined before any <img> in the body): swap a missing 3D asset for its emoji, or the bag's inline SVG.
window.fb=function(el,emoji){ var sp=document.createElement('span'); sp.className=el.className; sp.textContent=emoji; el.replaceWith(sp); };
window.bagFallback=function(el){ var tpl=document.getElementById('bagSvg'); if(tpl) el.replaceWith(tpl.content.cloneNode(true)); else el.remove(); };
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root{
    /* black & white, Helvetica; green only for the key things */
    --bg:#FFFFFF; --card:#FFFFFF; --surface:#F4F4F4; --line:#E3E3E3; --ink:#000000; --ink-soft:#666666;
    --green:#16A34A; --green-dark:#0F7A37; --green-soft:#E6F6EC;
    --c-common:#C8C8C8; --c-uncommon:#9A9A9A; --c-rare:#6A6A6A; --c-epic:#3A3A3A; --c-legendary:#000000;
    --radius:16px; --shadow:none;
    --tab-h:64px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,textarea,select{font-family:inherit;font-size:15px;color:var(--ink)}
  h1,h2,h3,.display{font-weight:800;letter-spacing:-.02em}
  [hidden]{display:none!important}
  a{color:var(--ink)}
  img.ic-img{width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.2em;display:inline-block}
  .mascot-sm{width:28px;height:28px;object-fit:contain;vertical-align:-7px;display:inline-block}
  .gate-mascot{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 4px}
  .tabbar button .ico img{width:28px;height:28px;object-fit:contain;display:block}
  .tabbar button .ico img.tab-av{border-radius:50%;background:var(--surface);border:2px solid transparent}
  .tabbar button.active .ico img.tab-av{border-color:var(--green)}
  .big img{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto}
  .pin img{width:26px;height:26px;object-fit:contain;display:block}
  .pin.world img{width:18px;height:18px}
  .sp .ic img{width:40px;height:40px;object-fit:contain;display:block;margin:0 auto}
  .avatar{overflow:hidden;padding:0}
  .avatar img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
  .avgrid button{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0;overflow:hidden;font-size:28px;line-height:1}
  .avgrid button img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .avgrid button.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
  .lb .av img{width:30px;height:30px;border-radius:50%;background:var(--surface);object-fit:cover;object-position:center top;display:block}
  .bd .ic img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto}
  .unlock .ic img{width:40px;height:40px;object-fit:contain;display:block}
  .bag img{width:100%;height:100%;object-fit:contain;display:block}

  /* ---------- shell ---------- */
  #app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
  .view{display:none;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tab-h) + var(--sab))}
  .view.active{display:block}
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;height:calc(var(--tab-h) + var(--sab));padding-bottom:var(--sab);background:#fff;border-top:1px solid var(--ink);display:flex;z-index:40}
  .tabbar button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-soft);position:relative;min-width:0;padding:0 2px}
  .tabbar button span.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tabbar button .ico{font-size:24px;line-height:1}
  .tabbar button.active{color:var(--green)}
  .tabbar button .badge{position:absolute;top:8px;left:calc(50% + 8px);background:var(--ink);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;min-width:18px;text-align:center}
  .page-head{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(12px + var(--sat)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .page-head h1{font-size:24px}
  .page-body{padding:14px}
  h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
  h3.sec span{font-size:12px;color:var(--ink-soft);font-weight:700;letter-spacing:0;text-transform:none}
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px}
  .btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;white-space:nowrap}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn.danger{background:var(--ink);color:#fff}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .row{display:flex;gap:10px}
  .row .btn{flex:1}
  .pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
  #geoPill{pointer-events:auto;cursor:pointer}
  .pill.ok{background:rgba(22,163,74,.92)} .pill.err{background:rgba(0,0,0,.75)}
  .rpill{color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px;display:inline-block}
  .rpill.cp{background:#fff;color:var(--ink);border:1.5px solid var(--ink);text-transform:none}
  .r-common{background:var(--c-common);color:#000} .r-uncommon{background:var(--c-uncommon);color:#000} .r-rare{background:var(--c-rare)} .r-epic{background:var(--c-epic)} .r-legendary{background:var(--c-legendary)}
  .pill-row{display:flex;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap}
  .pill-row.left{justify-content:flex-start}
  .input{width:100%;border:1px solid var(--ink);border-radius:10px;padding:9px 10px;background:#fff;font-size:13px}
  select.input{width:auto;min-width:140px}
  .empty{text-align:center;padding:60px 24px;color:var(--ink-soft);font-size:14px}
  .empty .big{font-size:56px;margin-bottom:8px}
  .big{font-size:56px}

  /* ---------- phone-only gate ---------- */
  .gate{position:fixed;inset:0;z-index:500;background:#000;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center}
  .gate-card{max-width:420px;width:100%}
  .gate-logo{font-weight:800;letter-spacing:-.03em;font-size:34px;color:#fff;margin-bottom:8px}
  .gate-logo span{color:var(--green)}
  .gate h2{font-size:24px;margin:10px 0 6px;color:#fff}
  .gate p{opacity:.9;font-size:15px;line-height:1.45;margin-bottom:18px}
  .qr{width:220px;height:220px;margin:0 auto 12px;background:#fff;border-radius:16px;padding:10px;display:flex;align-items:center;justify-content:center}
  .qr svg{width:100%;height:100%}
  .gate-url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;margin-bottom:10px;user-select:all}
  .gate small{opacity:.75;font-size:12px}

  /* ---------- catch (camera) ---------- */
  #view-catch{padding-bottom:0;min-height:0}
  .cam{position:relative;height:calc(100vh - var(--tab-h) - var(--sab));height:calc(100dvh - var(--tab-h) - var(--sab));background:#111;overflow:hidden}
  #cam{width:100%;height:100%;object-fit:cover;display:block;background:#111}
  .cam-off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;text-align:center;padding:24px}
  .cam-off .big{margin-bottom:10px}
  .cam-off p{opacity:.85;margin:0 auto 16px;max-width:300px;font-size:14px}
  .cam-top{position:absolute;top:0;left:0;right:0;padding:calc(12px + var(--sat)) 14px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
  .logo{font-weight:800;letter-spacing:-.03em;font-size:21px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);line-height:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .logo span{color:var(--green)}
  .cam-clock{position:absolute;top:calc(50px + var(--sat));right:14px;color:#fff;font-size:12px;font-weight:600;opacity:.9;text-shadow:1px 1px 0 rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
  .cam-city{position:absolute;top:calc(50px + var(--sat));left:14px;color:#fff;font-size:12px;font-weight:700;opacity:.95;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
  .cam-hint{position:absolute;bottom:128px;left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:1px 1px 2px rgba(0,0,0,.7);pointer-events:none;padding:0 20px}
  .cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:40px 28px 24px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .round{width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;font-size:22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .shutter{width:84px;height:84px;border-radius:50%;border:5px solid var(--green);background:transparent;padding:5px}
  .shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
  .shutter:active span{transform:scale(.85)}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  .flash.on{opacity:.9;transition:none}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
  .overlay.sheet{background:rgba(0,0,0,.6);align-items:center;justify-content:flex-end;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}

  /* encounter */
  #encounter{touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
  #encImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .5s}
  #encounter.caught #encImg{filter:saturate(.3) brightness(.45)}
  .enc-top{position:absolute;top:calc(18px + var(--sat));left:0;right:0;text-align:center;color:#fff;padding:0 20px;text-shadow:2px 2px 0 rgba(0,0,0,.55);z-index:2}
  .enc-title{font-weight:800;letter-spacing:-.02em;font-size:26px;line-height:1.1}
  .enc-sub{font-size:13px;font-weight:600;opacity:.95;margin-top:6px}
  .ring{position:absolute;left:50%;top:40%;width:170px;height:170px;margin:-85px 0 0 -85px;border:4px solid rgba(255,255,255,.95);border-radius:50%;box-shadow:0 0 0 6px rgba(0,0,0,.25),inset 0 0 0 4px rgba(0,0,0,.2);animation:pulse 1.6s ease-in-out infinite;z-index:1}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.7);opacity:1}}
  .enc-tags{position:absolute;left:0;right:0;bottom:196px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;z-index:2}
  .enc-tags .lbl{font-size:11px;color:#fff;font-weight:700;text-shadow:1px 1px 0 rgba(0,0,0,.6);letter-spacing:1px;text-transform:uppercase}
  .seg{display:flex;background:rgba(0,0,0,.55);border-radius:999px;padding:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .seg button{border:none;background:none;color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px}
  .seg button.on{background:var(--green);color:#fff}
  #segKind button{padding:5px 11px;font-size:18px;line-height:1}
  .seg img.kic{width:24px;height:24px;object-fit:contain;display:block}
  .enc-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(22px + var(--sab));display:flex;align-items:flex-end;justify-content:space-between;z-index:3}
  .link{border:none;background:rgba(0,0,0,.55);color:#fff;padding:10px 14px;border-radius:999px;font-weight:700;font-size:13px;margin-bottom:28px}
  .bagwrap{width:120px;height:140px;position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .45s cubic-bezier(.2,.8,.2,1);touch-action:none;cursor:grab}
  .bagwrap.dragging{transition:none;cursor:grabbing}
  .bagwrap.flying{transition:transform .6s cubic-bezier(.25,.1,.25,1)}
  .bagwrap.flying .bag-hint{opacity:0}
  .bag{width:110px;height:110px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
  .bag svg{width:100%;height:100%;display:block}
  .bag.wobble{animation:wobble .6s ease-in-out}
  @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-16deg)}75%{transform:rotate(16deg)}}
  .bag.burst{animation:burst .45s ease-out forwards}
  @keyframes burst{to{transform:scale(1.8);opacity:0}}
  .bag-hint{color:#fff;font-size:12px;font-weight:700;text-shadow:1px 1px 0 rgba(0,0,0,.6);margin-top:4px;animation:bob 1.4s ease-in-out infinite;transition:opacity .3s;text-align:center;white-space:nowrap}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .enc-msg{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);color:#fff;padding:14px 22px;border-radius:16px;font-weight:800;letter-spacing:-.02em;font-size:22px;text-align:center;animation:popin .3s;z-index:2;max-width:90%}
  @keyframes popin{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
  .shiny-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.35),transparent 55%);animation:pulse 1.2s ease-in-out infinite;z-index:1}

  /* result */
  #result{background:rgba(0,0,0,.9);align-items:center;justify-content:center;padding:16px;overflow:auto}
  .result-card{width:100%;max-width:420px;text-align:center;animation:cardin .4s cubic-bezier(.2,.8,.2,1);margin:auto}
  @keyframes cardin{from{transform:scale(.7) translateY(40px);opacity:0}}
  .gotcha{font-weight:800;letter-spacing:-.03em;font-size:44px;color:var(--green);line-height:1}
  .result-photo{position:relative;margin:12px 0;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:#eee}
  .result-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .new-tag{position:absolute;top:10px;left:10px;background:var(--green);color:#fff;font-weight:800;letter-spacing:-.02em;padding:5px 12px;border-radius:999px;transform:rotate(-6deg);font-size:18px;box-shadow:var(--shadow)}
  .shiny-tag{position:absolute;top:10px;right:10px;background:var(--ink);color:#fff;font-weight:800;padding:5px 10px;border-radius:999px;font-size:12px;box-shadow:var(--shadow)}
  .result-card h2{font-size:28px;color:var(--ink);line-height:1.1}
  .dex-text{font-size:14px;color:var(--ink-soft);font-style:italic;margin:6px 0 10px}
  .meta{font-size:13px;color:var(--ink);display:grid;gap:5px;text-align:left;background:var(--surface);border-radius:12px;padding:10px 12px;word-break:break-word}
  .meta small{color:var(--ink-soft)}
  .xp-gain{font-weight:800;letter-spacing:-.02em;font-size:28px;color:var(--green);margin:12px 0 4px}
  .levelup{background:var(--green);color:#fff;border-radius:12px;padding:10px;font-weight:800;letter-spacing:-.02em;font-size:20px;margin:8px 0}
  .unlock{display:flex;align-items:center;gap:10px;background:var(--green-soft);border:1px solid var(--green);border-radius:12px;padding:8px 12px;margin:6px 0;text-align:left;font-size:13px}
  .unlock .ic{font-size:26px}
  .unlock b{display:block}
  .result-card .row{margin-top:14px}
  .confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:150;pointer-events:none;animation:fall linear forwards;border-radius:2px}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}

  /* detail sheet */
  #detail .card{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:0 0 calc(16px + var(--sab));animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes slideup{from{transform:translateY(80px);opacity:0}}
  .d-photo{aspect-ratio:4/3;background:#222;position:relative}
  .d-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .d-photo.blurmode{outline:3px solid var(--green);outline-offset:-3px;cursor:crosshair}
  .blur-hint{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;padding:7px 10px;text-align:center}
  .d-close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:18px}
  .d-body{padding:14px 16px}
  .d-body h2{font-size:26px;color:var(--ink);line-height:1.1}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;font-size:13px;margin:10px 0;word-break:break-word}
  .kv b{color:var(--ink-soft);font-weight:600;white-space:nowrap}
  textarea.notes{width:100%;border:1px solid var(--ink);border-radius:12px;padding:10px;min-height:64px;resize:vertical;background:#fff;font-size:14px}
  .d-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .d-actions .btn{padding:11px 8px;font-size:14px;white-space:normal}

  /* ---------- map ---------- */
  #view-map{position:relative;padding-bottom:0;min-height:0;z-index:0;isolation:isolate}
  #map{height:calc(100vh - var(--tab-h) - var(--sab));height:calc(100dvh - var(--tab-h) - var(--sab));background:var(--surface);z-index:0;overflow:hidden}
  .map-logo{position:absolute;top:calc(12px + var(--sat));left:12px;z-index:400;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none}
  .map-logo .brand{background:#fff;border:1px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:800;letter-spacing:-.03em;font-size:17px;color:var(--ink)}
  .map-logo .brand span{color:var(--green)}
  .map-logo .count{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--ink-soft)}
  .map-ctl{position:absolute;right:12px;top:calc(60px + var(--sat));z-index:400;display:flex;flex-direction:column;gap:8px}
  .map-ctl button{width:44px;height:44px;border-radius:12px;border:1px solid var(--ink);background:#fff;font-size:20px}
  .map-ctl button.on{background:var(--green);border-color:var(--green);color:#fff}
  .pin{width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--c-common);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.35);line-height:1}
  .pin.world{width:26px;height:26px;font-size:14px;border-width:2px;opacity:.92;background:var(--surface)}
  .pin.shiny{box-shadow:0 0 0 3px var(--green),0 2px 6px rgba(0,0,0,.35)}
  .pin.me{width:18px;height:18px;border:3px solid #fff;background:var(--green);box-shadow:0 0 0 6px rgba(22,163,74,.3)}
  .map-banner{position:absolute;top:calc(12px + var(--sat));left:12px;right:68px;z-index:401;background:#fff;border:1px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .map-offline{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--ink-soft);background:var(--bg);z-index:300}
  .leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}
  .leaflet-popup-content .pop{min-width:150px}
  .pop img{width:100%;border-radius:8px;display:block;margin-bottom:6px;aspect-ratio:4/3;object-fit:cover;background:#eee}
  .pop .rpill{font-size:10px;padding:2px 8px}
  .pop .btn{margin-top:6px;width:100%}
  .leaflet-container{font-family:inherit}

  /* ---------- mierdex ---------- */
  .subtabs{display:flex;background:rgba(255,255,255,.15);border-radius:12px;padding:3px}
  .subtabs button{border:none;background:none;color:#fff;padding:6px 12px;border-radius:10px;font-weight:700;font-size:13px}
  .subtabs button.on{background:#fff;color:var(--ink)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px}
  .cap{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;display:block;width:100%}
  .cap .ph{aspect-ratio:1;background:#eee;position:relative}
  .cap .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .cap .ph .rdot{position:absolute;top:7px;left:7px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff}
  .cap .ph .sh{position:absolute;top:4px;right:7px;font-size:14px}
  .cap .ph .nl{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 6px;border-radius:999px}
  .cap .nm{font-weight:700;font-size:13px;padding:8px 10px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cap .tm{font-size:11px;color:var(--ink-soft);padding:2px 10px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sp-group{padding:4px 14px 10px}
  .sp-group h3{font-size:16px;margin:10px 0 6px;display:flex;align-items:center;gap:8px}
  .sp-group h3 .rpill{font-size:10px}
  .sp{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
  .sp .ic{font-size:30px;width:46px;text-align:center;position:relative;line-height:1;flex-shrink:0}
  .sp.unk .ic{filter:brightness(0);opacity:.3}
  .sp .ic small{position:absolute;right:-2px;bottom:-4px;font-size:15px}
  .sp .nm{font-weight:700;font-size:14px}
  .sp .ds{font-size:12px;color:var(--ink-soft)}
  .sp .ct{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink-soft);white-space:nowrap}

  /* ---------- trainer ---------- */
  .profile{display:flex;align-items:center;gap:14px}
  .avatar{width:72px;height:72px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:40px;border:3px solid var(--green);flex-shrink:0;line-height:1}
  .profile input{border:none;border-bottom:2px solid var(--line);font-size:20px;font-weight:800;width:100%;background:none;padding:4px 0;color:var(--ink);outline:none}
  .profile input:focus{border-bottom-color:var(--green)}
  .lvl{font-weight:800;letter-spacing:-.02em;color:var(--ink);font-size:18px;margin-top:4px}
  .xpbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
  .xpbar div{height:100%;background:var(--green);border-radius:6px;transition:width .4s}
  .xptxt{font-size:11px;color:var(--ink-soft);margin-top:4px;font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
  .stat{background:var(--surface);border-radius:12px;padding:10px 6px;text-align:center;grid-column:span 2;min-width:0}
  .stat.kinds{grid-column:span 6}
  .stat.kinds b{font-size:15px;letter-spacing:.5px}
  .stat.half{grid-column:span 3}
  .stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat span{font-size:11px;color:var(--ink-soft);font-weight:700}
  .badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .bd{text-align:center;background:var(--surface);border-radius:12px;padding:10px 4px;font-size:10px;font-weight:700;color:var(--ink-soft);min-width:0;overflow-wrap:anywhere}
  .bd .ic{font-size:28px;display:block;margin-bottom:4px;line-height:1}
  .bd.locked{opacity:.35;filter:grayscale(1)}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .set-row:last-child{border-bottom:none}
  .set-row small{display:block;color:var(--ink-soft);font-size:12px;font-weight:500}
  .set-row .input{margin-top:6px}
  .set-row select.input{margin-top:0}
  .switch{position:relative;width:48px;height:28px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch i{position:absolute;inset:0;background:#CFCFCF;border-radius:999px;transition:.2s;cursor:pointer}
  .switch i:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch input:checked+i{background:var(--green)}
  .switch input:checked+i:before{transform:translateX(20px)}
  .lb-title{font-weight:800;margin:12px 0 4px;font-size:14px}
  .lb-title small{font-weight:500;color:var(--ink-soft)}
  .lb{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .lb:last-child{border-bottom:none}
  .lb .rk{width:22px;font-weight:800;color:var(--ink-soft)}
  .lb .av{font-size:22px;line-height:1}
  .lb .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .lb .xp{font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .lb.me{background:var(--green-soft);margin:0 -8px;padding:7px 8px;border-radius:8px}

  #toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 16px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:300;pointer-events:none;max-width:90%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important;transition-duration:.01s!important} }
</style>

const wait=ms=>new Promise(r=>setTimeout(r,ms));
const uid=(p='c')=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
let lang='en';
function t(key,vars){ let s=(I18N[lang]&&I18N[lang][key])??I18N.en[key]??key; if(vars) for(const k in vars) s=s.split('{'+k+'}').join(String(vars[k])); return s; }
const locale=()=>{ const nl=navigator.language||''; return nl.toLowerCase().startsWith(lang)?nl:lang; };
const fmtDT=ts=>{ try{ return new Intl.DateTimeFormat(locale(),{dateStyle:'medium',timeStyle:'short'}).format(new Date(ts)); }catch(e){ return new Date(ts).toLocaleString(); } };
const fmtDate=ts=>{ try{ return new Intl.DateTimeFormat(locale(),{dateStyle:'medium'}).format(new Date(ts)); }catch(e){ return new Date(ts).toLocaleDateString(); } };
function fmtISO(ts){ const d=new Date(ts), off=-d.getTimezoneOffset(), s=off>=0?'+':'-';
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}${s}${pad2(Math.floor(Math.abs(off)/60))}:${pad2(Math.abs(off)%60)}`; }
const dayKey=ts=>{ const d=new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
function timeAgo(ts){ const s=Math.round((Date.now()-ts)/1000); let v=0,u='second';
  if(s>=45&&s<3600){ v=-Math.round(s/60); u='minute'; } else if(s>=3600&&s<86400){ v=-Math.round(s/3600); u='hour'; } else if(s>=86400&&s<30*86400){ v=-Math.round(s/86400); u='day'; } else if(s>=30*86400&&s<365*86400){ v=-Math.round(s/2592000); u='month'; } else if(s>=365*86400){ v=-Math.round(s/31536000); u='year'; }
  try{ const rtf=new Intl.RelativeTimeFormat(locale(),{numeric:'auto'}); return rtf.format(v,u); }catch(e){ return v===0?'now':`${-v} ${u}`; } }
const fmtCoord=(lat,lng)=>`${Math.abs(lat).toFixed(5)}° ${lat>=0?'N':'S'}, ${Math.abs(lng).toFixed(5)}° ${lng>=0?'E':'W'}`;
function haversine(a,b){ const R=6371000, toR=x=>x*Math.PI/180; const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
let toastT; function toast(msg,ms=2400){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),ms); }
function weightedPick(w){ const ks=Object.keys(w); let tot=0; ks.forEach(k=>tot+=Math.max(0,w[k]||0)); if(tot<=0) return ks[rndi(0,ks.length-1)];
  let r=Math.random()*tot; for(const k of ks){ r-=Math.max(0,w[k]||0); if(r<=0) return k; } return ks[ks.length-1]; }
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); }

function nearestCity(lat,lng){ if(typeof lat!=='number'||typeof lng!=='number') return null; let best=null;

  return best; }

function rollSpecies(ctx){
  const w={}; for(const r of RARITY_ORDER) w[r]=RARITY[r].weight;
  if(ctx.size==='XL'){ w.rare*=1.5; w.epic*=1.7; w.legendary*=2.2; }
  else if(ctx.size==='L'){ w.rare*=1.2; w.epic*=1.2; }
  else if(ctx.size==='S'){ w.common*=1.3; }
  if(ctx.fresh==='fossil'){ w.rare*=1.2; w.epic*=1.5; }
  const rarity=weightedPick(w);
  const kind=KINDS[ctx.kind]?ctx.kind:'poop'; let pool=SPECIES.filter(s=>s.rarity===rarity&&s.kind===kind); if(!pool.length) pool=SPECIES.filter(s=>s.kind===kind);
  const sw={}; pool.forEach(s=>sw[s.id]=s.boost?s.boost(ctx):1);
  const id=weightedPick(sw); return {species:id, rarity:SPECIES_BY_ID[id].rarity, shiny:Math.random()<SHINY_RATE};
}

/* ---------------- stats & progression ---------------- */
const RANK={common:0,uncommon:1,rare:2,epic:3,legendary:4};
function computeStats(list=captures){
  const st={total:list.length,xp:0,night:false,dawn:false,shiny:0,legendary:0,xl:0,fossil:0,species:{},speciesCount:0,curStreak:0,bestStreak:0,span:0,today:0,week:0,rarest:null,located:0,cities:{},cityCount:0,homeCity:null,kinds:{},kindCount:0};
  const days=new Set(); let minLat=90,maxLat=-90,minLng=180,maxLng=-180,hasLoc=false;
  const todayK=dayKey(Date.now()), weekAgo=Date.now()-7*864e5;
  for(const c of list){
    st.xp+=c.xp||0; const h=new Date(c.ts).getHours(); if(h<5) st.night=true; if(h>=5&&h<8) st.dawn=true;
    if(c.shiny) st.shiny++; if(c.rarity==='legendary') st.legendary++; if(c.size==='XL') st.xl++; if(c.fresh==='fossil') st.fossil++;
    st.species[c.species]=(st.species[c.species]||0)+1; const kk=kindOf(c); st.kinds[kk]=(st.kinds[kk]||0)+1; const dk=dayKey(c.ts); days.add(dk); if(dk===todayK) st.today++; if(c.ts>=weekAgo) st.week++;
    if(c.city){ const k=c.city+', '+c.cc; st.cities[k]=(st.cities[k]||0)+1; }
    if(c.lat!=null&&c.lng!=null){ hasLoc=true; st.located++; minLat=Math.min(minLat,c.lat); maxLat=Math.max(maxLat,c.lat); minLng=Math.min(minLng,c.lng); maxLng=Math.max(maxLng,c.lng); }
    if(!st.rarest || (RANK[c.rarity]||0)>(RANK[st.rarest.rarity]||0) || ((RANK[c.rarity]||0)===(RANK[st.rarest.rarity]||0) && (c.cp||0)>(st.rarest.cp||0))) st.rarest=c;
  }
  st.speciesCount=Object.keys(st.species).filter(id=>SPECIES_BY_ID[id]).length;
  st.cityCount=Object.keys(st.cities).length; st.kindCount=Object.keys(st.kinds).length; let hm=0; for(const k in st.cities) if(st.cities[k]>hm){ hm=st.cities[k]; st.homeCity=k; }
  if(hasLoc) st.span=haversine({lat:minLat,lng:minLng},{lat:maxLat,lng:maxLng});
  const sorted=[...days].sort(); let best=0,run=0,prev=null;
  for(const d of sorted){ run=(prev && (Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))-Date.UTC(+prev.slice(0,4),+prev.slice(5,7)-1,+prev.slice(8,10)))===864e5)?run+1:1; best=Math.max(best,run); prev=d; }
  st.bestStreak=best;
  let k=todayK; if(!days.has(k)) k=dayKey(Date.now()-864e5); let cur=0;
  while(days.has(k)){ cur++; k=dayKey(new Date(k+'T12:00:00').getTime()-864e5); }
  st.curStreak=cur; return st;
}

// Draw a video frame or image to a canvas (max 1280px), then to JPEG + a 240px thumbnail data URL. The canvas is kept for the face check.
function drawFrame(src,w,h){ const MAX=1280, s=Math.min(1,MAX/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s)); c.getContext('2d').drawImage(src,0,0,c.width,c.height); return c; }
function canvasToBlobs(c){
  const ts=Math.min(1,240/Math.max(c.width,c.height)); const tc=document.createElement('canvas'); tc.width=Math.max(1,Math.round(c.width*ts)); tc.height=Math.max(1,Math.round(c.height*ts)); tc.getContext('2d').drawImage(c,0,0,tc.width,tc.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res({blob:b,thumb:tc.toDataURL('image/jpeg',.7),w:c.width,h:c.height}):rej(new Error('Could not encode photo')),'image/jpeg',.85));
}
async function frameToBlobs(src,w,h){ const c=drawFrame(src,w,h); const fr=await canvasToBlobs(c); fr.canvas=c; return fr; }
async function shrinkDataUrl(du,max,q=.6){ const img=await loadImage(du); const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q); }

function parseExif(buf){
  const dv=new DataView(buf), out={}; if(dv.byteLength<4||dv.getUint16(0)!==0xFFD8) return out; let off=2;
  while(off+4<=dv.byteLength){ const marker=dv.getUint16(off); if((marker&0xFF00)!==0xFF00||marker===0xFFDA||marker===0xFFD9) break; const len=dv.getUint16(off+2);
    if(marker===0xFFE1 && off+10<=dv.byteLength && dv.getUint32(off+4)===0x45786966){ parseTiff(dv,off+10,out); break; } off+=2+len; }
  return out;
}
function parseTiff(dv,tiff,out){
  const le=dv.getUint16(tiff)===0x4949; const u16=o=>dv.getUint16(o,le), u32=o=>dv.getUint32(o,le); if(u16(tiff+2)!==42) return;
  const readIfd=o=>{ const n=u16(o), tags={}; for(let i=0;i<n;i++){ const e=o+2+i*12; tags[u16(e)]={type:u16(e+2),count:u32(e+4),voff:e+8}; } return tags; };
  const SZ={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
  const val=tg=>{ const size=SZ[tg.type]||1, total=size*tg.count, o=total>4?tiff+u32(tg.voff):tg.voff;
    if(tg.type===2){ let s=''; for(let i=0;i<tg.count;i++){ const c=dv.getUint8(o+i); if(!c) break; s+=String.fromCharCode(c); } return s; }
    const a=[]; for(let i=0;i<tg.count;i++){ const p=o+i*size; if(tg.type===3) a.push(u16(p)); else if(tg.type===4) a.push(u32(p)); else if(tg.type===5) a.push(u32(p)/(u32(p+4)||1));
      else if(tg.type===9) a.push(dv.getInt32(p,le)); else if(tg.type===10) a.push(dv.getInt32(p,le)/(dv.getInt32(p+4,le)||1)); else a.push(dv.getUint8(p)); } return a; };
  const t0=readIfd(tiff+u32(tiff+4));
  if(t0[0x8769]){ const ex=readIfd(tiff+val(t0[0x8769])[0]); const d=ex[0x9003]&&val(ex[0x9003]); const m=d&&/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(d);
    if(m){ const ts=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime(); if(isFinite(ts)&&ts>0) out.ts=ts; } }
  if(t0[0x8825]){ const g=readIfd(tiff+val(t0[0x8825])[0]);
    if(g[2]&&g[4]){ const la=val(g[2]), lo=val(g[4]); const lat=(la[0]||0)+(la[1]||0)/60+(la[2]||0)/3600, lng=(lo[0]||0)+(lo[1]||0)/60+(lo[2]||0)/3600;
      const latRef=g[1]?val(g[1]):'N', lngRef=g[3]?val(g[3]):'E';
      if(isFinite(lat)&&isFinite(lng)&&lat<=90&&lng<=180&&(lat||lng)){ out.lat=latRef==='S'?-lat:lat; out.lng=lngRef==='W'?-lng:lng; } } }
}

const cam={stream:null,facing:settings.facing||'environment',ok:false,starting:false,wanted:false,fallbackKey:null};
async function camStart(){
  cam.wanted=true; if(cam.starting||cam.stream) return; cam.starting=true; const v=$('#cam');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){ camFallback(window.isSecureContext?'cam_noapi':'cam_https'); cam.starting=false; return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cam.facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(!cam.wanted){ stream.getTracks().forEach(tr=>tr.stop()); cam.starting=false; return; }
    cam.stream=stream; v.srcObject=stream; await v.play().catch(()=>{}); cam.ok=true; $('#camOff').hidden=true;
  }catch(e){ camFallback(e&&e.name==='NotAllowedError'?'cam_denied':'cam_none'); }
  cam.starting=false;
}
function camStop(){ cam.wanted=false; if(cam.stream){ cam.stream.getTracks().forEach(tr=>tr.stop()); cam.stream=null; } cam.ok=false; const v=$('#cam'); if(v&&v.srcObject) v.srcObject=null; }

const geo={fix:null,watchId:null,status:'off',err:null,lowAcc:false,retryT:null};
function renderGeo(){ const p=$('#geoPill'); p.className='pill';

  else p.textContent='📍 '+t('gps_off');
  const cc=geo.fix?nearestCity(geo.fix.lat,geo.fix.lng):null; $('#camCity').textContent=geo.fix?`🏙️ ${cc?cc.name+', '+cc.cc:t('outside')}`:''; }
function geoStart(){ if(!navigator.geolocation){ geo.status='error'; renderGeo(); return; } if(geo.watchId!=null) return; clearTimeout(geo.retryT); geo.status=geo.fix?'ok':'acquiring'; renderGeo();

  const opts=geo.lowAcc?{enableHighAccuracy:false,maximumAge:30000,timeout:30000}:{enableHighAccuracy:true,maximumAge:5000,timeout:20000};
  geo.watchId=navigator.geolocation.watchPosition(p=>{ geo.fix={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()}; geo.status='ok'; geo.err=null; renderGeo(); updateMeMarker(); },
    e=>{ geo.err=e; if(geo.fix) return;
      if(e.code===1){ geo.status='error'; renderGeo(); return; }
      geoStop(); if(!geo.lowAcc){ geo.lowAcc=true; geoStart(); } else { geo.status='error'; renderGeo(); geo.retryT=setTimeout(()=>{ if(!geo.fix&&currentTab==='catch'){ geo.lowAcc=false; geoStart(); } },20000); } },opts); }
function geoStop(){ if(geo.watchId!=null){ navigator.geolocation.clearWatch(geo.watchId); geo.watchId=null; } clearTimeout(geo.retryT); }
// Re-ask from a tap: a user gesture is what makes some phones show the permission prompt again.
function geoRetry(){ const denied=geo.err&&geo.err.code===1; geoStop(); geo.lowAcc=false; geo.err=null; geo.fix=null; geo.status='acquiring'; renderGeo(); geoStart(); if(denied) toast(t('gps_allow'),5000); }

  return new Promise(res=>{ if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p=>{ geo.fix={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()}; geo.status='ok'; renderGeo(); res(geo.fix); },
      ()=>res(geo.fix||null),{enableHighAccuracy:true,timeout:8000,maximumAge:60000}); }); }
const freshFix=()=>geo.fix&&Date.now()-geo.fix.t<45000?geo.fix:null;

/* ---------------- encounter & capture ---------------- */
/* ---------------- privacy: faces are blurred on the phone ---------------- */
// Face detection runs on the device (MediaPipe Face Detector, loaded on demand and cached by the service
// worker; the browser's own FaceDetector as a fallback). Faces become a coarse mosaic before the photo is
// saved; nothing is uploaded for the check. window.__faceDetector lets the tests plug in a stub.
const MP_BASE='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL='https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
const blurOn=()=>settings.blurFaces!==false;
let faceDet=null, faceDetP=null;
function getFaceDetector(){
  if(faceDet) return Promise.resolve(faceDet);
  if(!faceDetP) faceDetP=(async()=>{
    if(window.__faceDetector){ faceDet=window.__faceDetector; return faceDet; }
    try{
      const mod=await import(MP_BASE+'/vision_bundle.mjs');
      const files=await mod.FilesetResolver.forVisionTasks(MP_BASE+'/wasm');
      const d=await mod.FaceDetector.createFromOptions(files,{baseOptions:{modelAssetPath:FACE_MODEL},runningMode:'IMAGE',minDetectionConfidence:.4});
      faceDet={detect:src=>d.detect(src).detections.map(x=>x.boundingBox).filter(Boolean).map(b=>({x:b.originX,y:b.originY,w:b.width,h:b.height}))};
    }catch(e){
      if(!('FaceDetector' in window)) throw e;
      const nd=new window.FaceDetector({fastMode:false});
      faceDet={detect:async src=>(await nd.detect(src)).map(f=>({x:f.boundingBox.x,y:f.boundingBox.y,w:f.boundingBox.width,h:f.boundingBox.height}))};
    }
    return faceDet;
  })().catch(e=>{ faceDetP=null; throw e; });
  return faceDetP;
}
async function detectFaces(src){ const d=await getFaceDetector(); const boxes=await d.detect(src); return (boxes||[]).filter(b=>b&&b.w>0&&b.h>0); }
// Replace each box by an elliptical mosaic of about 7 cells across: beyond recognition, no smoothing.
function pixelateBoxes(cv,boxes,ex=1.5,ey=1.7){
  const x=cv.getContext('2d'), W=cv.width, H=cv.height;
  for(const b of boxes){
    const cx=b.x+b.w/2, cy=b.y+b.h/2, rw=Math.max(8,b.w/2*ex), rh=Math.max(8,b.h/2*ey);
    const x0=Math.max(0,Math.floor(cx-rw)), y0=Math.max(0,Math.floor(cy-rh)), x1=Math.min(W,Math.ceil(cx+rw)), y1=Math.min(H,Math.ceil(cy+rh)); const w=x1-x0, h=y1-y0; if(w<2||h<2) continue;
    const cell=Math.max(6,Math.round(Math.max(w,h)/7)); const sw=Math.max(1,Math.round(w/cell)), sh=Math.max(1,Math.round(h/cell));
    const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh; tmp.getContext('2d').drawImage(cv,x0,y0,w,h,0,0,sw,sh);
    x.save(); x.beginPath(); x.ellipse(cx,cy,rw,rh,0,0,Math.PI*2); x.clip(); x.imageSmoothingEnabled=false; x.drawImage(tmp,0,0,sw,sh,x0,y0,w,h); x.restore();
  }
}
const facesText=c=>c.faces==null?t('faces_na'):c.faces===0?t('faces_0'):c.faces===1?t('faces_1'):t('faces_n',{n:c.faces});
// Draw on a saved photo and store it again (face mosaic or a manual spot). draw() returns false to keep the photo as it is.
async function rewritePhoto(c,draw){
  const blob=await dbGet('photos',c.id); if(!blob) throw new Error('photo missing');
  const img=await blobToImage(blob); const cv=drawFrame(img,img.naturalWidth,img.naturalHeight); const n=await draw(cv);
  if(n!==false){ const fr=await canvasToBlobs(cv); await dbPut('photos',fr.blob,c.id); c.thumb=fr.thumb; }
  await saveCapture(c); return n;
}
const faceJobs=new Map();
// Make sure a capture's faces were checked and blurred (before posting, or to finish a check that was still running).
function ensureFaces(c){
  if(Number.isInteger(c.faces)) return Promise.resolve(c.faces);
  if(faceJobs.has(c.id)) return faceJobs.get(c.id);
  const job=rewritePhoto(c,async cv=>{ const boxes=await detectFaces(cv); if(boxes.length) pixelateBoxes(cv,boxes); c.faces=boxes.length; return boxes.length?c.faces:false; }).finally(()=>faceJobs.delete(c.id));
  faceJobs.set(c.id,job); return job;
}
// Manual blur around a tapped point (nx, ny in 0..1 of the photo).
function blurSpot(c,nx,ny){
  return rewritePhoto(c,cv=>{ const r=Math.max(cv.width,cv.height)*.09; pixelateBoxes(cv,[{x:nx*cv.width-r,y:ny*cv.height-r,w:2*r,h:2*r}],1,1); c.blurred=(c.blurred||0)+1; return c.blurred; });
}
function refreshPhotoViews(c){

  if(!$('#result').hidden&&$('#result').dataset.id===c.id){ $('#resFaces').textContent=facesText(c); dbGet('photos',c.id).then(b=>{ if(b) $('#resImg').src=URL.createObjectURL(b); }).catch(()=>{}); }
  renderAll();
}
let blurMode=false;
function setBlurMode(on){ blurMode=on; $('.d-photo').classList.toggle('blurmode',on); $('#dBlurHint').hidden=!on; $('#dBlur').textContent=t(on?'blur_done':'blur_spot'); $('#dBlur').classList.toggle('primary',on); }
async function onPhotoTap(e){
  const c=curDetail(); if(!blurMode||!c) return; const img=$('#dImg'); const r=img.getBoundingClientRect(); const nw=img.naturalWidth||1, nh=img.naturalHeight||1;
  const s=Math.max(r.width/nw,r.height/nh); const dx=(r.width-nw*s)/2, dy=(r.height-nh*s)/2;
  const nx=((e.clientX-r.left)-dx)/(nw*s), ny=((e.clientY-r.top)-dy)/(nh*s); if(nx<0||nx>1||ny<0||ny>1) return;
  try{ await blurSpot(c,nx,ny); refreshPhotoViews(c); toast(t('t_blurred')); }catch(err){ toast(t('t_blur_fail',{e:err.message})); }
}

/* ---------------- official X account ---------------- */
// Captures go (faces blurred, coordinates rounded) to the poster service in ../x-poster, which holds the
// account keys and lets the owner review each post. Set X_POSTER_URL after deploying it; the settings
// field overrides it on a phone.
const X_POSTER_URL='https://mierdasdelmundo-x-poster.vercel.app';
const xBase=()=>(settings.xUrl||X_POSTER_URL).trim().replace(/\/+$/,'');
const xReady=()=>!!settings.xOn&&/^https:\/\//.test(xBase());
async function xReq(path,method='GET',body){
  const r=await fetch(xBase()+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||('HTTP '+r.status)); return d;
}
const xJobs=new Map();
function postToX(c){
  if(xJobs.has(c.id)) return xJobs.get(c.id);
  const job=(async()=>{
    if(!xReady()) throw new Error(t('x_not_configured')); if(c.lat==null) throw new Error(t('x_need_loc'));
    if(c.xStatus==='pending'||c.xStatus==='posted') return {status:c.xStatus,url:c.xUrl};
    try{ await ensureFaces(c); }catch(e){ throw new Error(t('t_faces_offline')); }
    const blob=await dbGet('photos',c.id); if(!blob) throw new Error('photo missing');
    const img=await blobToImage(blob); const cv=drawFrame(img,img.naturalWidth,img.naturalHeight);
    const body={id:c.id,ts:c.ts,lat:+c.lat.toFixed(4),lng:+c.lng.toFixed(4),city:c.city||null,cc:c.cc||null,kind:kindOf(c),species:speciesOf(c.species).name,speciesId:c.species,rarity:c.rarity,shiny:!!c.shiny,cp:c.cp,size:c.size,fresh:c.fresh,
      trainer:(profile.name||'Anonymous').slice(0,24),tid:profile.tid,faces:c.faces,blurred:true,image:cv.toDataURL('image/jpeg',.8)};
    const d=await xReq('/api/submit','POST',body);
    c.xStatus=d.status==='posted'?'posted':'pending'; c.xUrl=d.url||''; c.xAt=Date.now(); await saveCapture(c); refreshPhotoViews(c); return d;
  })().finally(()=>{ xJobs.delete(c.id); refreshXViews(c); });
  xJobs.set(c.id,job); return job;
}
const xChecked=new Map();
async function refreshXStatus(c){
  if(c.xStatus!=='pending'||!xReady()) return; if(Date.now()-(xChecked.get(c.id)||0)<60000) return; xChecked.set(c.id,Date.now());
  try{ const d=await xReq('/api/status?id='+encodeURIComponent(c.id)); if(d.status&&d.status!==c.xStatus){ c.xStatus=d.status; c.xUrl=d.url||c.xUrl||''; await saveCapture(c); refreshXViews(c); } }catch(e){}
}
function xButton(btn,c){
  const on=xReady(); btn.hidden=!on; if(!on) return;
  const sending=xJobs.has(c.id); btn.disabled=sending||c.xStatus==='pending'||c.xStatus==='rejected';
  btn.textContent=sending?t('x_sending'):c.xStatus==='posted'?t('x_posted'):c.xStatus==='pending'?t('x_sent'):c.xStatus==='rejected'?t('x_rejected'):t('x_post');
  btn.classList.toggle('primary',c.xStatus==='posted');
}
function refreshXViews(c){ if($('#result').dataset.id===c.id) xButton($('#resX'),c); if(detailId===c.id) xButton($('#dX'),c); }
async function onPostToX(btn,c){
  if(c.xStatus==='posted'&&c.xUrl){ window.open(c.xUrl,'_blank','noopener'); return; }
  btn.disabled=true; btn.textContent=t('x_sending');
  try{ const d=await postToX(c); toast(t(d.status==='posted'?'t_x_posted':'t_x_sent')); }catch(e){ toast(t('t_x_err',{e:e.message})); }
  xButton(btn,c);

let enc=null; const bagDrag={dx:0,dy:0};

async function onFile(file,fromGallery){
  if(!file) return; if(!/^image\//.test(file.type||'')&&!/\.(jpe?g|png|webp|heic)$/i.test(file.name||'')){ toast(t('t_pick_image')); return; }

  try{
    const img=await blobToImage(file); const fr=await frameToBlobs(img,img.naturalWidth,img.naturalHeight);
    let ts=Date.now(), tsFrom='now';
    if(exif.ts){ ts=exif.ts; tsFrom='exif'; } else if(fromGallery&&file.lastModified&&file.lastModified<Date.now()-60000){ ts=file.lastModified; tsFrom='file'; }
    let loc=null, locFrom='';
    if(exif.lat!=null){ loc={lat:exif.lat,lng:exif.lng,acc:null,t:ts}; locFrom='exif'; } else if(!fromGallery){ loc=freshFix(); locFrom=loc?'gps':''; }
    startEncounter({...fr,ts,loc,src:fromGallery?'gallery':'camera',tsFrom,locFrom}); if(!loc&&!fromGallery) refreshEncLoc(enc);
  }catch(e){ toast(t('t_photo_fail',{e:e.message})); }
}

async function finishCapture(){

    .map(([i,v,l])=>`<div class="stat"><b>${v}</b><span>${i} ${esc(l)}</span></div>`).join('')+`<div class="stat half"><b style="font-size:15px" title="${esc(rarest)}">${esc(rarest)}</b><span>🏆 ${esc(t('st_rarest'))}</span></div><div class="stat half"><b style="font-size:15px">${esc(st.homeCity||'—')}</b><span>🏠 ${esc(t('st_home'))}</span></div>`+'<div class="stat kinds"><b>'+KIND_ORDER.map(k=>KINDS[k].icon+' '+(st.kinds[k]||0)).join('  ·  ')+'</b><span>'+esc(t('st_kinds'))+'</span></div>';
  const earned=new Set(BADGES.filter(bd=>bd.test(st)).map(bd=>bd.id)); $('#badgeCount').textContent=`${earned.size}/${BADGES.length}`;
  $('#badges').innerHTML=BADGES.map(bd=>`<div class="bd${earned.has(bd.id)?'':' locked'}" title="${esc(bdDesc(bd))}"><span class="ic">${badgeHtml(bd)}</span>${esc(bdName(bd))}</div>`).join('');
  $('#cloudOn').checked=settings.cloudOn; if(document.activeElement!==$('#cloudUrl')) $('#cloudUrl').value=settings.cloudUrl; $('#autoPublish').checked=settings.autoPublish; $('#cloudCfg').hidden=!settings.cloudOn;
  const unpub=captures.filter(c=>!c.published&&c.lat!=null).length; $('#unpubTxt').textContent=unpub?t('unpub_n',{n:unpub}):t('unpub_0'); $('#btnPublishAll').disabled=!unpub;
  $('#blurOn').checked=blurOn(); $('#xOn').checked=!!settings.xOn; if(document.activeElement!==$('#xUrl')) $('#xUrl').value=settings.xUrl||X_POSTER_URL; $('#xAuto').checked=settings.xAuto!==false; $('#xCfg').hidden=!settings.xOn;
  $('#soundOn').checked=settings.sound; $('#langSel').value=lang; $('#footerTxt').textContent=t('footer',{id:profile.tid});
  if(settings.cloudOn){ renderLeaderboard(); renderCityboard(); } else { $('#leaderboard').innerHTML=''; $('#cityboard').innerHTML=''; }
}
function renderAvatar(){ $('#avatarBtn').innerHTML=avatarHtml(profile.avatar); $('#tabAvatar').innerHTML=avatarHtml(profile.avatar,'tab-av'); $('#avGrid').innerHTML=AVATARS.map(a=>`<button data-av="${a}" class="${a===profile.avatar?'on':''}" type="button">${avatarHtml(a)}</button>`).join(''); }
function renderTrainerIfVisible(){ if($('#view-trainer').classList.contains('active')) renderTrainer(); }
async function exportAll(){
  const out={app:'mierdasdelmundo',version:1,exportedAt:new Date().toISOString(),profile:{name:profile.name,avatar:profile.avatar,tid:profile.tid},captures:[]};
  for(const c of captures){ let photo=null; try{ const b=await dbGet('photos',c.id); if(b) photo=await blobToDataUrl(b); }catch(e){} out.captures.push({...c,photo}); }
  download(new Blob([JSON.stringify(out)],{type:'application/json'}),`mierdasdelmundo-backup-${dayKey(Date.now())}.json`); toast(t('t_exported',{n:captures.length}));
}
async function importFile(file){
  if(!file) return;
  try{ const d=JSON.parse(await file.text()); if(!d||(d.app!=='mierdasdelmundo'&&d.app!=='poopgo')||!Array.isArray(d.captures)) throw new Error(t('t_not_backup'));
    const have=new Set(captures.map(c=>c.id)); let n=0;
    for(const c of d.captures){ if(!c||typeof c.id!=='string'||have.has(c.id)||typeof c.ts!=='number'||!RARITY[c.rarity]) continue; const {photo,...rec}=c; rec.published=0; if(rec.city===undefined) assignCity(rec);
      if(typeof photo==='string'&&photo.startsWith('data:image/')) await dbPut('photos',dataUrlToBlob(photo),rec.id); if(typeof rec.thumb!=='string') rec.thumb=photo||''; await saveCapture(rec); captures.push(rec); have.add(rec.id); n++; }
    captures.sort((a,b)=>b.ts-a.ts);
    if(d.profile){ if(!profile.name&&typeof d.profile.name==='string') profile.name=d.profile.name.slice(0,24); if(AVATARS.includes(d.profile.avatar)) profile.avatar=d.profile.avatar; saveProfile(); }
    markBadgesSeen(); renderAll(); toast(t('t_imported',{n}));
  }catch(e){ toast(t('t_import_fail',{e:e.message})); }
}
async function resetAll(){
  if(!confirm(t('confirm_reset',{n:captures.length}))) return;
  try{ await dbClear('captures'); await dbClear('photos'); }catch(e){ toast(t('t_reset_fail',{e:e.message})); return; }
  captures=[]; try{ localStorage.setItem(LS_SEEN,'[]'); }catch(e){} renderAll(); toast(t('t_reset_done'));
}

/* ---------------- world sync (Firebase RTDB via REST) ---------------- */
const cloudBase=()=>settings.cloudUrl.trim().replace(/\/+$/,'')+'/'+(settings.cloudRoot||'mierdasdelmundo').replace(/^\/+|\/+$/g,'');
async function cloudReq(path,method='GET',body){
  if(!/^https:\/\//.test(settings.cloudUrl.trim())) throw new Error(t('e_bad_url'));
  const [p,q]=path.split('?'); const url=cloudBase()+p+'.json'+(q?'?'+q:'');
  const r=await fetch(url,{method,body:body===undefined?undefined:JSON.stringify(body)}).catch(()=>{ throw new Error(t('e_network')); });
  if(!r.ok){ let msg='HTTP '+r.status; try{ const j=await r.json(); if(j&&j.error) msg+=' · '+j.error; }catch(e){} throw new Error(msg); }
  return r.status===204?null:r.json();
}
async function publishCapture(c){
  if(!settings.cloudOn) throw new Error(t('e_sync_off')); if(c.lat==null||c.lng==null) throw new Error(t('e_no_loc'));
  const s={id:c.id,ts:c.ts,lat:+c.lat.toFixed(4),lng:+c.lng.toFixed(4),city:c.city||null,cc:c.cc||null,kind:kindOf(c),species:c.species,rarity:c.rarity,shiny:!!c.shiny,cp:c.cp,size:c.size,fresh:c.fresh,trainer:(profile.name||'Anonymous').slice(0,24),tid:profile.tid,avatar:profile.avatar,pub:Date.now()};
  await cloudReq('/sightings/'+encodeURIComponent(c.id),'PUT',s);
  if(c.thumb){ try{ await cloudReq('/thumbs/'+encodeURIComponent(c.id),'PUT',await shrinkDataUrl(c.thumb,96)); }catch(e){} }
  c.published=Date.now(); await saveCapture(c); worldCache=null; updateLeaderboard().catch(()=>{});
}
async function publishAll(){
  const list=captures.filter(c=>!c.published&&c.lat!=null); if(!list.length) return; const btn=$('#btnPublishAll'); btn.disabled=true; let n=0;
  for(const c of list){ try{ await publishCapture(c); n++; btn.textContent=`${n}/${list.length}`; }catch(e){ toast(t('t_world_err',{e:e.message})); break; } }
  btn.textContent=t('publish_all'); renderTrainer(); if(n) toast(t('t_published_n',{n}));
}
let worldCache=null;
async function fetchWorld(){
  if(worldCache&&Date.now()-worldCache.t<60000) return worldCache.list;
  let all; try{ all=await cloudReq('/sightings?orderBy="ts"&limitToLast=2000'); }catch(e){ all=await cloudReq('/sightings'); }
  const list=Object.values(all||{}).filter(s=>s&&typeof s==='object'&&typeof s.id==='string'&&typeof s.ts==='number').sort((a,b)=>b.ts-a.ts).slice(0,2000);
  worldCache={t:Date.now(),list}; return list;
}
async function updateLeaderboard(){ const st=computeStats(); await cloudReq('/trainers/'+encodeURIComponent(profile.tid),'PUT',{tid:profile.tid,name:(profile.name||'Anonymous').slice(0,24),avatar:profile.avatar,xp:st.xp,level:levelFor(st.xp),captures:st.total,species:st.speciesCount,cities:st.cityCount,home:st.homeCity||null,updated:Date.now()}); }
let lbSeq=0;
async function renderLeaderboard(){
  const el=$('#leaderboard'), seq=++lbSeq; el.innerHTML=`<div class="lb-title">🏆 ${esc(t('lb_title'))} <small>${esc(t('lb_loading'))}</small></div>`;
  try{ const all=await cloudReq('/trainers'); if(seq!==lbSeq) return; const list=Object.values(all||{}).filter(x=>x&&typeof x.xp==='number').sort((a,b)=>b.xp-a.xp).slice(0,10);
    if(!list.length){ el.innerHTML=`<div class="lb-title">🏆 ${esc(t('lb_title'))}</div><small>${esc(t('lb_empty'))}</small>`; return; }
    el.innerHTML=`<div class="lb-title">🏆 ${esc(t('lb_title'))}</div>`+list.map((x,i)=>`<div class="lb${x.tid===profile.tid?' me':''}"><span class="rk">${i+1}</span><span class="av">${avatarHtml(x.avatar)}</span><span class="nm">${esc(String(x.name||'Anonymous').slice(0,24))}${x.home?` <small>· ${esc(String(x.home).slice(0,30))}</small>`:''}</span><span class="xp">${esc(t('lv',{n:+x.level||1}))} · ${Math.round(x.xp)} XP · ${+x.captures||0} 💩</span></div>`).join('');
  }catch(e){ if(seq!==lbSeq) return; el.innerHTML=`<div class="lb-title">🏆 ${esc(t('lb_title'))}</div><small>${esc(t('lb_err',{e:e.message}))}</small>`; }
}
let cbSeq=0;
async function renderCityboard(){
  const el=$('#cityboard'), seq=++cbSeq; el.innerHTML=`<div class="lb-title">🏙️ ${esc(t('cities_title'))} <small>${esc(t('lb_loading'))}</small></div>`;
  try{ const list=await fetchWorld(); if(seq!==cbSeq) return; const counts={}; for(const s of list){ if(!s.city) continue; const k=String(s.city).slice(0,40)+(s.cc?', '+String(s.cc).slice(0,3):''); counts[k]=(counts[k]||0)+1; }
    const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10); const st=computeStats();
    if(!top.length){ el.innerHTML=`<div class="lb-title">🏙️ ${esc(t('cities_title'))}</div><small>${esc(t('cities_empty'))}</small>`; return; }
    el.innerHTML=`<div class="lb-title">🏙️ ${esc(t('cities_title'))}</div>`+top.map(([k,n],i)=>`<div class="lb${k===st.homeCity?' me':''}"><span class="rk">${i+1}</span><span class="nm">${esc(k)}</span><span class="xp">${n} 💩</span></div>`).join('');
  }catch(e){ if(seq!==cbSeq) return; el.innerHTML=`<div class="lb-title">🏙️ ${esc(t('cities_title'))}</div><small>${esc(t('lb_err',{e:e.message}))}</small>`; }
}

/* ---------------- phone-only gate ---------------- */
const isDev=/[?&]dev=1/.test(location.search);
function isPhone(){ const ua=navigator.userAgent||''; if(/Android|iPhone|iPad|iPod|Mobile|IEMobile|Opera Mini|Silk/i.test(ua)) return true;
  const coarse=matchMedia('(pointer: coarse)').matches, touch=navigator.maxTouchPoints>0; return touch&&coarse&&Math.min(screen.width,screen.height)<=1024; }
function showGate(){
  $('#app').hidden=true; const g=$('#gate'); g.hidden=false; const url=location.href.replace(/[?#].*$/,''); $('#gateUrl').textContent=url;
  const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  s.onload=()=>{ try{ const qr=window.qrcode(0,'M'); qr.addData(url); qr.make(); $('#qr').innerHTML=qr.createSvgTag({cellSize:6,margin:0,scalable:true}); }catch(e){ $('#qr').textContent='💩'; } };
  s.onerror=()=>{ $('#qr').textContent='💩'; }; document.head.appendChild(s);
}

  // encounter

  $('#segSize').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||!enc) return; enc.size=b.dataset.v; $$('#segSize button').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#segFresh').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||!enc) return; enc.fresh=b.dataset.v; $$('#segFresh button').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#encCancel').addEventListener('click',()=>cancelEncounter(false)); $('#encThrow').addEventListener('click',throwBag);
  (function(){ const w=$('#bagWrap'); let st=null;
    w.addEventListener('pointerdown',e=>{ if(!enc||enc.throwing) return; st={x:e.clientX,y:e.clientY}; try{ w.setPointerCapture(e.pointerId); }catch(err){} w.classList.add('dragging'); e.preventDefault(); });
    w.addEventListener('pointermove',e=>{ if(!st) return; bagDrag.dx=e.clientX-st.x; bagDrag.dy=e.clientY-st.y; w.style.transform=`translate(${bagDrag.dx}px,${bagDrag.dy}px)`; });
    const end=e=>{ if(!st) return; const dy=e.clientY-st.y; st=null; w.classList.remove('dragging'); if(dy<-60) throwBag(); else { bagDrag.dx=0; bagDrag.dy=0; w.style.transform=''; } };
    w.addEventListener('pointerup',end); w.addEventListener('pointercancel',end); })();
  // result
  $('#resDone').addEventListener('click',closeResult); $('#resShare').addEventListener('click',()=>{ const c=captures.find(x=>x.id===$('#result').dataset.id); if(c) shareCapture(c); });
  // detail
  $('#dClose').addEventListener('click',closeDetail); $('#detail').addEventListener('click',e=>{ if(e.target===$('#detail')) closeDetail(); });
  $('#dShare').addEventListener('click',()=>{ const c=curDetail(); if(c) shareCapture(c); });
  $('#dDelete').addEventListener('click',()=>{ const c=curDetail(); if(c) deleteCapture(c); });
  $('#dPublish').addEventListener('click',async()=>{ const c=curDetail(); if(!c) return; if(c.lat==null){ toast(t('t_set_loc_first')); return; } try{ $('#dPublish').disabled=true; await publishCapture(c); toast(t('t_published')); openDetail(c.id); }catch(e){ $('#dPublish').disabled=false; toast(t('t_world_err',{e:e.message})); } });
  $('#dLoc').addEventListener('click',()=>{ const c=curDetail(); if(!c) return; const id=c.id; closeDetail();

  $('#dTime').addEventListener('click',()=>{ const e=$('#dTimeEdit'); e.hidden=!e.hidden; if(!e.hidden) $('#dTimeInput').focus(); });
  $('#dTimeInput').addEventListener('change',e=>{ const c=curDetail(); if(!c||!e.target.value) return; const ts=new Date(e.target.value).getTime(); if(!isFinite(ts)) return; c.ts=ts; c.tsFrom='manual'; c.published=0; saveCapture(c).then(()=>{ captures.sort((a,b)=>b.ts-a.ts); renderAll(); toast(t('t_time')); openDetail(c.id); }); });
  let notesT; $('#dNotes').addEventListener('input',e=>{ const c=curDetail(); if(!c) return; c.notes=e.target.value.slice(0,500); clearTimeout(notesT); notesT=setTimeout(()=>saveCapture(c),400); });
  // mierdex
  $$('.subtabs button').forEach(b=>b.addEventListener('click',()=>{ dexTab=b.dataset.dex; $$('.subtabs button').forEach(x=>x.classList.toggle('on',x===b)); renderDex(); }));
  $('#dexChips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return; dexFilter=b.dataset.f; renderDex(); });
  $('#dexBody').addEventListener('click',e=>{ const b=e.target.closest('[data-open]'); if(b) openDetail(b.dataset.open); });
  // map
  $('#btnLocate').addEventListener('click',locateMe); $('#btnFit').addEventListener('click',()=>{ fitToCaptures(); if(!captures.some(c=>c.lat!=null)) toast(t('t_no_located')); }); $('#btnWorld').addEventListener('click',toggleWorld); $('#mapBannerCancel').addEventListener('click',pickEnd);
  // trainer & settings
  let nameT; $('#nameInput').addEventListener('input',e=>{ profile.name=e.target.value.trim().slice(0,24); clearTimeout(nameT); nameT=setTimeout(()=>{ saveProfile(); if(settings.cloudOn) updateLeaderboard().catch(()=>{}); },500); });
  $('#avatarBtn').addEventListener('click',()=>{ const g=$('#avGrid'); g.hidden=!g.hidden; });
  $('#avGrid').addEventListener('click',e=>{ const b=e.target.closest('[data-av]'); if(!b) return; profile.avatar=b.dataset.av; saveProfile(); renderAvatar(); $('#avGrid').hidden=true; if(settings.cloudOn) updateLeaderboard().catch(()=>{}); });

  $('#btnPublishAll').addEventListener('click',publishAll);

}
window.openDetail=openDetail;
(async function init(){
  lang=detectLang(); applyI18n();
  if(!isPhone()&&!isDev){ showGate(); return; }
  try{ captures=(await dbGetAll('captures')).sort((a,b)=>b.ts-a.ts); }catch(e){ captures=[]; toast(t('t_storage',{e:e.message}),5000); }
  let touched=false; for(const c of captures){ if(c.city===undefined){ assignCity(c); touched=true; } } if(touched) for(const c of captures) saveCapture(c).catch(()=>{});
  if(localStorage.getItem(LS_SEEN)==null) markBadgesSeen();
  bindEvents(); applyI18n(); renderAvatar(); renderAll(); showTab('catch');
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="mierdasdelmundo — record the shit of the world's big cities, put it on the map and see if somebody does something about it.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="mierdasdelmundo">
<title>mierdasdelmundo</title>
<script>
// Image fallback (defined before any <img> in the body): swap a missing 3D asset for its emoji.
window.fb=function(el,emoji){ var sp=document.createElement('span'); sp.className=el.className; sp.textContent=emoji; el.replaceWith(sp); };
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  :root{
    /* black & white, Helvetica; green only for the key things */
    --bg:#FFFFFF; --surface:#F4F4F4; --line:#E3E3E3; --ink:#000000; --ink-soft:#666666;
    --green:#16A34A; --green-dark:#0F7A37; --green-soft:#E6F6EC;
    --radius:16px; --tab-h:76px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,select{font-family:inherit;font-size:15px;color:var(--ink)}
  h1,h2,h3{font-weight:800;letter-spacing:-.02em}
  [hidden]{display:none!important}
  a{color:var(--ink)}
  img.ic-img{width:1.15em;height:1.15em;object-fit:contain;vertical-align:-.2em;display:inline-block}
  .gate-mascot{width:150px;height:150px;object-fit:contain;display:block;margin:0 auto 4px}
  .big img{width:96px;height:96px;object-fit:contain;display:block;margin:0 auto}
  .pin img{width:26px;height:26px;object-fit:contain;display:block}
  .pin.world img{width:18px;height:18px}

  /* ---------- shell ---------- */
  #app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
  #intro{position:fixed;inset:0;z-index:600;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:background .5s}
  #intro[hidden]{display:none}
  .intro-name{font-weight:800;letter-spacing:-.03em;font-size:34px;color:#000;animation:introName .9s cubic-bezier(.2,.8,.2,1) both}
  .intro-name span{color:var(--green)}
  .intro-poop{width:min(50vw,220px);height:min(50vw,220px);object-fit:contain;transform-origin:50% 100%;animation:poopForm 1.3s cubic-bezier(.34,1.4,.4,1) .35s both}
  @keyframes introName{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes poopForm{0%{opacity:0;transform:scaleY(.08) scaleX(.5) translateY(14px)}55%{opacity:1;transform:scaleY(1.12) scaleX(.94)}75%{transform:scaleY(.96) scaleX(1.04)}100%{opacity:1;transform:none}}
  #intro.out{background:rgba(255,255,255,0)}
  #intro.out .intro-name{opacity:0;transition:opacity .3s}
  #intro.out .intro-poop{animation:none;transform-origin:0 0;transition:transform .6s cubic-bezier(.4,0,.2,1)}
  @media (prefers-reduced-motion:reduce){.intro-name,.intro-poop{animation:none}}
  .view{display:none;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tab-h) + var(--sab))}
  .view.active{display:block}
  /* the only navigation: one toggle at the bottom, you on the left, the camera in the middle, the map on the right */
  .navtoggle{position:fixed;bottom:calc(12px + var(--sab));left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .navtoggle button{width:68px;height:46px;border:none;border-radius:999px;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s;-webkit-tap-highlight-color:transparent}
  .navtoggle button .ico{font-size:26px;line-height:1;display:flex}
  .navtoggle button .ico img{width:30px;height:30px;object-fit:contain;display:block}
  .navtoggle button .ico img.tab-av{border-radius:50%;background:#fff;border:2px solid #fff;object-fit:cover;object-position:center top}
  .navtoggle button.on{background:var(--green)}
  .page-head{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(12px + var(--sat)) 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .page-head h1{font-size:24px}
  .page-head .pill{background:rgba(255,255,255,.18)}
  .page-body{padding:14px}
  h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin:22px 4px 8px}
  .card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:16px}
  .btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;white-space:nowrap}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn.danger{background:var(--ink);color:#fff}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .row{display:flex;gap:10px}
  .row .btn{flex:1}
  .pill{background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
  #geoPill{pointer-events:auto;cursor:pointer}
  .pill.ok{background:rgba(22,163,74,.92)} .pill.err{background:rgba(0,0,0,.75)}
  .input{width:100%;border:1px solid var(--ink);border-radius:10px;padding:9px 10px;background:#fff;font-size:13px}
  select.input{width:auto;min-width:140px}
  .empty{text-align:center;padding:50px 24px;color:var(--ink-soft);font-size:14px;line-height:1.5}
  .empty .big{font-size:56px;margin-bottom:8px}
  .big{font-size:56px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- phone-only gate ---------- */
  .gate{position:fixed;inset:0;z-index:500;background:#000;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center}
  .gate-card{max-width:420px;width:100%}
  .gate-logo{font-weight:800;letter-spacing:-.03em;font-size:34px;color:#fff;margin-bottom:8px}
  .gate-logo span{color:var(--green)}
  .gate h2{font-size:24px;margin:10px 0 6px;color:#fff}
  .gate p{opacity:.9;font-size:15px;line-height:1.45;margin-bottom:18px}
  .qr{width:220px;height:220px;margin:0 auto 12px;background:#fff;border-radius:16px;padding:10px;display:flex;align-items:center;justify-content:center}
  .qr svg{width:100%;height:100%}
  .gate-url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;margin-bottom:10px;user-select:all}
  .gate small{opacity:.75;font-size:12px}

  /* ---------- camera ---------- */
  #view-catch{padding-bottom:0;min-height:0}
  .cam{position:relative;height:100vh;height:100dvh;background:#111;overflow:hidden}
  #cam{width:100%;height:100%;object-fit:cover;display:block;background:#111}
  .cam-off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;text-align:center;padding:24px}
  .cam-off .big{margin-bottom:10px}
  .cam-off p{opacity:.85;margin:0 auto 16px;max-width:300px;font-size:14px}
  .cam-top{position:absolute;top:0;left:0;right:0;padding:calc(12px + var(--sat)) 14px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
  .logo{line-height:0;color:#fff;font-size:34px}
  .logo img{width:44px;height:44px;object-fit:contain;display:block;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
  .cam-clock{position:absolute;top:calc(64px + var(--sat));right:14px;color:#fff;font-size:12px;font-weight:600;opacity:.9;text-shadow:1px 1px 0 rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
  .cam-city{position:absolute;top:calc(64px + var(--sat));left:14px;color:#fff;font-size:12px;font-weight:700;opacity:.95;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
  .cam-hint{position:absolute;bottom:calc(var(--tab-h) + var(--sab) + 104px);left:0;right:0;text-align:center;color:#fff;font-size:13px;font-weight:600;text-shadow:1px 1px 2px rgba(0,0,0,.7);pointer-events:none;padding:0 20px}
  .cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:40px 28px calc(var(--tab-h) + var(--sab));display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.55))}
  .shutter{width:84px;height:84px;border-radius:50%;border:5px solid var(--green);background:transparent;padding:5px}
  .shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .1s}
  .shutter:active span{transform:scale(.85)}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  .flash.on{opacity:.9;transition:none}

  /* ---------- overlays ---------- */
  .overlay{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}
  .overlay.sheet{background:rgba(0,0,0,.6);align-items:center;justify-content:flex-end;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}

  /* the card you see right after the shutter: the photo, what it is, where, and whether it is on the map */
  #post{background:rgba(0,0,0,.9);align-items:center;justify-content:center;padding:16px;overflow:auto}
  .post-card{width:100%;max-width:420px;text-align:center;animation:cardin .4s cubic-bezier(.2,.8,.2,1);margin:auto;background:#fff;border-radius:var(--radius);padding:16px}
  @keyframes cardin{from{transform:scale(.7) translateY(40px);opacity:0}}
  .post-photo{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:#eee}
  .post-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .post-kind{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:14px 0 4px;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:8px}
  .post-kind img{width:34px;height:34px;object-fit:contain}
  .post-meta{font-size:13px;color:var(--ink-soft);line-height:1.5}
  .post-status{margin-top:12px;font-size:14px;font-weight:700;line-height:1.45;background:var(--surface);border-radius:12px;padding:10px 12px}
  .post-status.ok{background:var(--green-soft);color:var(--green-dark)}
  .post-card .row{margin-top:14px}

  /* detail sheet */
  #detail .card{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:0 0 calc(16px + var(--sab));animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes slideup{from{transform:translateY(80px);opacity:0}}
  .d-photo{aspect-ratio:4/3;background:#222;position:relative}
  .d-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .d-close{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:18px}
  .d-body{padding:14px 16px}
  .d-body h2{font-size:24px;color:var(--ink);line-height:1.1;display:flex;align-items:center;gap:8px}
  .d-body h2 img{width:32px;height:32px;object-fit:contain}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13px;margin:12px 0;word-break:break-word}
  .kv b{color:var(--ink-soft);font-weight:600;white-space:nowrap}
  .kv small{color:var(--ink-soft)}
  .d-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
  .d-actions .btn{padding:11px 8px;font-size:14px;white-space:normal}

  /* ---------- map: nothing on it but the pins ---------- */
  #view-map{position:relative;padding-bottom:0;min-height:0;z-index:0;isolation:isolate}
  #map{height:100vh;height:100dvh;background:var(--surface);z-index:0;overflow:hidden}
  .pin{width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.35);line-height:1}
  .pin.world{width:26px;height:26px;font-size:14px;border-width:2px;border-color:#9A9A9A;opacity:.92;background:var(--surface)}
  .pin.me{width:18px;height:18px;border:3px solid #fff;background:var(--green);box-shadow:0 0 0 6px rgba(22,163,74,.3)}
  .pin.cleared{opacity:.6;position:relative}
  .pin.cleared::after{content:'✓';position:absolute;right:-5px;bottom:-5px;width:15px;height:15px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;font-weight:700;line-height:15px;text-align:center}
  .map-banner{position:absolute;top:calc(12px + var(--sat));left:12px;right:12px;z-index:401;background:#fff;border:1px solid var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .map-offline{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--ink-soft);background:var(--bg);z-index:300}
  .leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}
  .leaflet-popup-content .pop{min-width:170px}
  .pop img{width:100%;border-radius:8px;display:block;margin-bottom:6px;aspect-ratio:4/3;object-fit:cover;background:#eee}
  .pop b{font-size:14px}
  .pop .btn{margin-top:6px;width:100%}
  .pop .gone{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  .pop .gone small{display:block;color:var(--ink-soft);margin-bottom:2px}
  .pop .gone.cleared{color:var(--green-dark);font-weight:700;font-size:13px}
  .pop .btn[disabled]{opacity:.55;white-space:normal;font-size:12px}
  .leaflet-container{font-family:inherit}
  .leaflet-bottom{bottom:calc(var(--tab-h) + var(--sab) - 8px)}

  /* ---------- you: your character, your records and their fate ---------- */
  .me{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .me .av{width:64px;height:64px;border-radius:50%;background:var(--surface);border:3px solid var(--green);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1}
  .me .av img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .me b{display:block;font-size:16px}
  .me small{display:block;color:var(--ink-soft);font-size:12px;margin-top:2px}
  .avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
  .avgrid button{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0;overflow:hidden;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
  .avgrid button img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
  .avgrid button.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
  #setup .post-card{text-align:left}
  #setup h2{font-size:24px;line-height:1.1}
  #setup .avgrid{margin-top:12px}
  #setup .input{margin-top:12px;font-size:16px;padding:12px;border-radius:12px}
  .pop .pop-av{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:center top;background:#fff;border:1px solid var(--line);vertical-align:middle;margin-right:4px;display:inline-block}
  .you-sub{font-size:13px;color:var(--ink-soft);margin:2px 4px 12px;font-weight:600}
  .rec{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
  .rec img.ph{width:72px;height:72px;border-radius:10px;object-fit:cover;background:#eee;flex-shrink:0}
  .rec-body{min-width:0;flex:1}
  .rec .nm{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec .nm img{width:22px;height:22px;object-fit:contain;flex-shrink:0}
  .rec .tm{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rec .st{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface);color:var(--ink-soft)}
  .rec .st.on{background:var(--green-soft);color:var(--green-dark)}
  .rec .st.done{background:var(--green);color:#fff}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .set-row:last-child{border-bottom:none}
  .set-row small{display:block;color:var(--ink-soft);font-size:12px;font-weight:500}
  .switch{position:relative;width:48px;height:28px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch i{position:absolute;inset:0;background:#CFCFCF;border-radius:999px;transition:.2s;cursor:pointer}
  .switch i:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .switch input:checked+i{background:var(--green)}
  .switch input:checked+i:before{transform:translateX(20px)}

  #toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 16px + var(--sab));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:300;pointer-events:none;max-width:90%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%)}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important;transition-duration:.01s!important} }
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <img class="gate-mascot" src="assets/mascot.png" alt="" onerror="this.remove()">
    <div class="gate-logo">mierdas<span>del</span>mundo</div>
    <h2 data-i18n="gate_title"></h2>
    <p data-i18n="gate_body"></p>
    <div class="qr" id="qr"></div>
    <div class="gate-url" id="gateUrl"></div>
    <small data-i18n="gate_scan"></small>
  </div>
</div>
<div id="intro" hidden><div class="intro-name">mierdas<span>del</span>mundo</div><img class="intro-poop" id="introPoop" src="assets/mascot.png" alt="" onerror="fb(this,'💩')"></div>
<div id="app">
<main>
<!-- ================= CAMERA ================= -->
<section id="view-catch" class="view active">
  <div class="cam">
    <video id="cam" autoplay playsinline muted></video>
    <div class="cam-off" id="camOff" hidden>
      <div>
        <div class="big"><img src="assets/cam.png" alt="" onerror="fb(this,'📷')"></div>
        <p id="camOffMsg"></p>
        <button class="btn primary" id="btnFileCam" data-i18n="take_photo"></button>
      </div>
    </div>
    <div class="cam-top">
      <div class="logo"><img src="assets/mascot.png" alt="mierdasdelmundo" onerror="fb(this,'💩')"></div>
      <div class="pill" id="geoPill" role="button"></div>
    </div>
    <div class="cam-city" id="camCity"></div>
    <div class="cam-clock" id="clock"></div>
    <div class="cam-hint" id="camHint" data-i18n="cam_hint"></div>
    <div class="cam-bottom">
      <button class="shutter" id="btnShutter" aria-label="Capture"><span></span></button>
    </div>
    <div class="flash" id="flash"></div>
  </div>
</section>

<!-- ================= MAP ================= -->
<section id="view-map" class="view">
  <div id="map"></div>
  <div class="map-banner" id="mapBanner" hidden><span data-i18n="pick_hint"></span><button class="btn sm" id="mapBannerCancel" data-i18n="cancel"></button></div>
  <div class="map-offline" id="mapOffline" hidden><div><div class="big"><img src="assets/map.png" alt="" onerror="fb(this,'🗺️')"></div><p data-i18n="map_offline"></p></div></div>
</section>

<!-- ================= YOU ================= -->
<section id="view-you" class="view">
  <div class="page-head"><h1 data-i18n="you_title"></h1><span class="pill" id="youCount"></span></div>
  <div class="page-body">
    <div class="card" style="margin-bottom:14px">
      <div class="me"><div class="av" id="meAv"></div><div><b id="meName"></b><small data-i18n="me_locked"></small></div></div>
    </div>
    <p class="you-sub" id="youSub"></p>
    <div id="recList"></div>
    <h3 class="sec" data-i18n="settings"></h3>
    <div class="card">

async function tx(store,mode,fn){ const d=await db(); return new Promise((res,rej)=>{ const tr=d.transaction(store,mode); const r=fn(tr.objectStore(store));
  tr.oncomplete=()=>res(r instanceof IDBRequest?r.result:r); tr.onerror=()=>rej(tr.error); tr.onabort=()=>rej(tr.error||new Error('aborted')); }); }

function assignCity(c){ const n=c.lat!=null&&c.lng!=null?nearestCity(c.lat,c.lng):null; c.city=n?n.name:null; c.cc=n?n.cc:null; return c; }
function detectLang(){ if(settings.lang&&I18N[settings.lang]) return settings.lang; for(const l of (navigator.languages||[navigator.language||'en'])){ const k=String(l).slice(0,2).toLowerCase(); if(I18N[k]) return k; } return 'en'; }

/* ---------------- images & EXIF ---------------- */
function loadImage(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('Could not decode image')); i.src=src; }); }
async function blobToImage(blob){ const u=URL.createObjectURL(blob); try{ return await loadImage(u); } finally{ setTimeout(()=>URL.revokeObjectURL(u),2000); } }
// Draw a video frame or image to a canvas (max 1280px), then to JPEG + a 320px thumbnail data URL. The canvas is kept for the face and kind checks.
const THUMB=320;
function drawFrame(src,w,h){ const MAX=1280, s=Math.min(1,MAX/Math.max(w,h)); const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s)); c.getContext('2d').drawImage(src,0,0,c.width,c.height); return c; }
function canvasToBlobs(c){
  const ts=Math.min(1,THUMB/Math.max(c.width,c.height)); const tc=document.createElement('canvas'); tc.width=Math.max(1,Math.round(c.width*ts)); tc.height=Math.max(1,Math.round(c.height*ts)); tc.getContext('2d').drawImage(c,0,0,tc.width,tc.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res({blob:b,thumb:tc.toDataURL('image/jpeg',.7),w:c.width,h:c.height}):rej(new Error('Could not encode photo')),'image/jpeg',.85));
}
async function frameToBlobs(src,w,h){ const c=drawFrame(src,w,h); const fr=await canvasToBlobs(c); fr.canvas=c; return fr; }
async function shrinkDataUrl(du,max,q=.6){ const img=await loadImage(du); const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s)); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',q); }
// Minimal EXIF reader for photos from the camera-app fallback: DateTimeOriginal + GPS. Returns {ts?, lat?, lng?}. Throws on malformed data (caller catches).
function parseExif(buf){
  const dv=new DataView(buf), out={}; if(dv.byteLength<4||dv.getUint16(0)!==0xFFD8) return out; let off=2;
  while(off+4<=dv.byteLength){ const marker=dv.getUint16(off); if((marker&0xFF00)!==0xFF00||marker===0xFFDA||marker===0xFFD9) break; const len=dv.getUint16(off+2);
    if(marker===0xFFE1 && off+10<=dv.byteLength && dv.getUint32(off+4)===0x45786966){ parseTiff(dv,off+10,out); break; } off+=2+len; }
  return out;
}
function parseTiff(dv,tiff,out){
  const le=dv.getUint16(tiff)===0x4949; const u16=o=>dv.getUint16(o,le), u32=o=>dv.getUint32(o,le); if(u16(tiff+2)!==42) return;
  const readIfd=o=>{ const n=u16(o), tags={}; for(let i=0;i<n;i++){ const e=o+2+i*12; tags[u16(e)]={type:u16(e+2),count:u32(e+4),voff:e+8}; } return tags; };
  const SZ={1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8};
  const val=tg=>{ const size=SZ[tg.type]||1, total=size*tg.count, o=total>4?tiff+u32(tg.voff):tg.voff;
    if(tg.type===2){ let s=''; for(let i=0;i<tg.count;i++){ const c=dv.getUint8(o+i); if(!c) break; s+=String.fromCharCode(c); } return s; }
    const a=[]; for(let i=0;i<tg.count;i++){ const p=o+i*size; if(tg.type===3) a.push(u16(p)); else if(tg.type===4) a.push(u32(p)); else if(tg.type===5) a.push(u32(p)/(u32(p+4)||1));
      else if(tg.type===9) a.push(dv.getInt32(p,le)); else if(tg.type===10) a.push(dv.getInt32(p,le)/(dv.getInt32(p+4,le)||1)); else a.push(dv.getUint8(p)); } return a; };
  const t0=readIfd(tiff+u32(tiff+4));
  if(t0[0x8769]){ const ex=readIfd(tiff+val(t0[0x8769])[0]); const d=ex[0x9003]&&val(ex[0x9003]); const m=d&&/^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(d);
    if(m){ const ts=new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime(); if(isFinite(ts)&&ts>0) out.ts=ts; } }
  if(t0[0x8825]){ const g=readIfd(tiff+val(t0[0x8825])[0]);
    if(g[2]&&g[4]){ const la=val(g[2]), lo=val(g[4]); const lat=(la[0]||0)+(la[1]||0)/60+(la[2]||0)/3600, lng=(lo[0]||0)+(lo[1]||0)/60+(lo[2]||0)/3600;
      const latRef=g[1]?val(g[1]):'N', lngRef=g[3]?val(g[3]):'E';
      if(isFinite(lat)&&isFinite(lng)&&lat<=90&&lng<=180&&(lat||lng)){ out.lat=latRef==='S'?-lat:lat; out.lng=lngRef==='W'?-lng:lng; } } }
}

/* ---------------- camera (always the back one) ---------------- */
const cam={stream:null,ok:false,starting:false,wanted:false,fallbackKey:null};
async function camStart(){
  cam.wanted=true; if(cam.starting||cam.stream) return; cam.starting=true; const v=$('#cam');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.isSecureContext){ camFallback(window.isSecureContext?'cam_noapi':'cam_https'); cam.starting=false; return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(!cam.wanted){ stream.getTracks().forEach(tr=>tr.stop()); cam.starting=false; return; }
    cam.stream=stream; v.srcObject=stream; await v.play().catch(()=>{}); cam.ok=true; $('#camOff').hidden=true;
  }catch(e){ camFallback(e&&e.name==='NotAllowedError'?'cam_denied':'cam_none'); }
  cam.starting=false;
}
function camStop(){ cam.wanted=false; if(cam.stream){ cam.stream.getTracks().forEach(tr=>tr.stop()); cam.stream=null; } cam.ok=false; const v=$('#cam'); if(v&&v.srcObject) v.srcObject=null; }
function camFallback(key){ cam.ok=false; cam.fallbackKey=key; $('#camOffMsg').textContent=t(key); $('#camOff').hidden=false; }
function flash(){ const f=$('#flash'); f.classList.add('on'); requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove('on'))); }

/* ---------------- geolocation ---------------- */
const geo={fix:null,watchId:null,status:'off',err:null,lowAcc:false,retryT:null};
function renderGeo(){ const p=$('#geoPill'); p.className='pill';
  if(geo.status==='ok'&&geo.fix){ p.classList.add('ok'); p.textContent='📍 '+t('gps_acc',{n:Math.round(geo.fix.acc||0)}); }
  else if(geo.status==='acquiring'){ p.textContent='📡 '+t('gps_finding'); }
  else if(geo.status==='error'){ p.classList.add('err'); p.textContent='📍 '+t(geo.err&&geo.err.code===1?'gps_denied':'gps_none')+' · '+t('gps_retry'); }
  else p.textContent='📍 '+t('gps_off');
  const cc=geo.fix?nearestCity(geo.fix.lat,geo.fix.lng):null; $('#camCity').textContent=geo.fix?`🏙️ ${cc?cc.name+', '+cc.cc:t('outside')}`:''; }
function geoStart(){ if(!navigator.geolocation){ geo.status='error'; renderGeo(); return; } if(geo.watchId!=null) return; clearTimeout(geo.retryT); geo.status=geo.fix?'ok':'acquiring'; renderGeo();
  // first the real GPS; if it gives nothing, network location (Wi-Fi / cell); then keep retrying while the camera is open
  const opts=geo.lowAcc?{enableHighAccuracy:false,maximumAge:30000,timeout:30000}:{enableHighAccuracy:true,maximumAge:5000,timeout:20000};
  geo.watchId=navigator.geolocation.watchPosition(p=>{ geo.fix={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()}; geo.status='ok'; geo.err=null; renderGeo(); updateMeMarker(); },
    e=>{ geo.err=e; if(geo.fix) return;
      if(e.code===1){ geo.status='error'; renderGeo(); return; }
      geoStop(); if(!geo.lowAcc){ geo.lowAcc=true; geoStart(); } else { geo.status='error'; renderGeo(); geo.retryT=setTimeout(()=>{ if(!geo.fix&&currentTab==='catch'){ geo.lowAcc=false; geoStart(); } },20000); } },opts); }
function geoStop(){ if(geo.watchId!=null){ navigator.geolocation.clearWatch(geo.watchId); geo.watchId=null; } clearTimeout(geo.retryT); }
// Re-ask from a tap: a user gesture is what makes some phones show the permission prompt again.
function geoRetry(){ const denied=geo.err&&geo.err.code===1; geoStop(); geo.lowAcc=false; geo.err=null; geo.fix=null; geo.status='acquiring'; renderGeo(); geoStart(); if(denied) toast(t('gps_allow'),5000); }
function geoNow(){ if(geo.fix&&Date.now()-geo.fix.t<45000) return Promise.resolve(geo.fix);
  return new Promise(res=>{ if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p=>{ geo.fix={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()}; geo.status='ok'; renderGeo(); res(geo.fix); },
      ()=>res(geo.fix||null),{enableHighAccuracy:true,timeout:8000,maximumAge:60000}); }); }
const freshFix=()=>geo.fix&&Date.now()-geo.fix.t<45000?geo.fix:null;

/* ---------------- privacy: faces are blurred on the phone ---------------- */
// Face detection runs on the device (MediaPipe Face Detector, loaded on demand and cached by the service
// worker; the browser's own FaceDetector as a fallback). Faces become a coarse mosaic before the photo is
// saved and shared; nothing is uploaded for the check. window.__faceDetector lets the tests plug in a stub.
const MP_BASE='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const FACE_MODEL='https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
let visionP=null;
function getVision(){ if(!visionP) visionP=(async()=>{ const mod=await import(MP_BASE+'/vision_bundle.mjs'); const files=await mod.FilesetResolver.forVisionTasks(MP_BASE+'/wasm'); return {mod,files}; })().catch(e=>{ visionP=null; throw e; }); return visionP; }
let faceDet=null, faceDetP=null;
function getFaceDetector(){
  if(faceDet) return Promise.resolve(faceDet);
  if(!faceDetP) faceDetP=(async()=>{
    if(window.__faceDetector){ faceDet=window.__faceDetector; return faceDet; }
    try{
      const {mod,files}=await getVision();
      const d=await mod.FaceDetector.createFromOptions(files,{baseOptions:{modelAssetPath:FACE_MODEL},runningMode:'IMAGE',minDetectionConfidence:.4});
      faceDet={detect:src=>d.detect(src).detections.map(x=>x.boundingBox).filter(Boolean).map(b=>({x:b.originX,y:b.originY,w:b.width,h:b.height}))};
    }catch(e){
      if(!('FaceDetector' in window)) throw e;
      const nd=new window.FaceDetector({fastMode:false});
      faceDet={detect:async src=>(await nd.detect(src)).map(f=>({x:f.boundingBox.x,y:f.boundingBox.y,w:f.boundingBox.width,h:f.boundingBox.height}))};
    }
    return faceDet;
  })().catch(e=>{ faceDetP=null; throw e; });
  return faceDetP;
}
async function detectFaces(src){ const d=await getFaceDetector(); const boxes=await d.detect(src); return (boxes||[]).filter(b=>b&&b.w>0&&b.h>0); }
// Replace each box by an elliptical mosaic of about 7 cells across: beyond recognition, no smoothing.
function pixelateBoxes(cv,boxes,ex=1.5,ey=1.7){
  const x=cv.getContext('2d'), W=cv.width, H=cv.height;
  for(const b of boxes){
    const cx=b.x+b.w/2, cy=b.y+b.h/2, rw=Math.max(8,b.w/2*ex), rh=Math.max(8,b.h/2*ey);
    const x0=Math.max(0,Math.floor(cx-rw)), y0=Math.max(0,Math.floor(cy-rh)), x1=Math.min(W,Math.ceil(cx+rw)), y1=Math.min(H,Math.ceil(cy+rh)); const w=x1-x0, h=y1-y0; if(w<2||h<2) continue;
    const cell=Math.max(6,Math.round(Math.max(w,h)/7)); const sw=Math.max(1,Math.round(w/cell)), sh=Math.max(1,Math.round(h/cell));
    const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh; tmp.getContext('2d').drawImage(cv,x0,y0,w,h,0,0,sw,sh);
    x.save(); x.beginPath(); x.ellipse(cx,cy,rw,rh,0,0,Math.PI*2); x.clip(); x.imageSmoothingEnabled=false; x.drawImage(tmp,0,0,sw,sh,x0,y0,w,h); x.restore();
  }
}
// Draw on a saved photo and store it again. draw() returns false to keep the photo as it is.
async function rewritePhoto(c,draw){
  const blob=await dbGet('photos',c.id); if(!blob) throw new Error('photo missing');
  const img=await blobToImage(blob); const cv=drawFrame(img,img.naturalWidth,img.naturalHeight); const n=await draw(cv);
  if(n!==false){ const fr=await canvasToBlobs(cv); await dbPut('photos',fr.blob,c.id); c.thumb=fr.thumb; }
  await saveRecord(c); return n;
}
const faceJobs=new Map();
// Make sure a record's faces were checked and blurred (to finish a check that could not run at capture time).
function ensureFaces(c){
  if(Number.isInteger(c.faces)) return Promise.resolve(c.faces);
  if(faceJobs.has(c.id)) return faceJobs.get(c.id);
  const job=rewritePhoto(c,async cv=>{ const boxes=await detectFaces(cv); if(boxes.length) pixelateBoxes(cv,boxes); c.faces=boxes.length; return boxes.length?c.faces:false; }).finally(()=>faceJobs.delete(c.id));
  faceJobs.set(c.id,job); return job;
}

/* ---------------- what kind of shit is it? ---------------- */
// An on-device image classifier (MediaPipe Image Classifier, EfficientNet-Lite0, ImageNet labels) decides whether the
// photo shows a car, a lock, something holding a parking spot or dumped trash. Anything else is poop. The model is
// downloaded once and cached by the service worker. window.__kindClassifier lets the tests plug in a stub.
const KIND_MODEL='https://storage.googleapis.com/mediapipe-models/image_classifier/efficientnet_lite0/float32/1/efficientnet_lite0.tflite';
const KIND_LABELS={
  car:['sports car','cab','minivan','pickup','convertible','limousine','jeep','police van','station wagon','beach wagon','racer','car wheel','car mirror','tow truck','moving van','trailer truck','minibus','ambulance','fire engine','recreational vehicle','golfcart','go-kart','motor scooter','moped','grille','trolleybus','school bus','snowplow','garbage truck','tractor','forklift'],
  lock:['padlock','combination lock','chain','bicycle-built-for-two','mountain bike','shopping cart','tricycle','unicycle','turnstile'],
  cone:['traffic cone','folding chair','rocking chair','barber chair','street sign','carton','crate','barrel','pot','milk can','bucket','rain barrel','pole','parking meter','picket fence','chainlink fence','mailbox'],
  trash:['plastic bag','trash can','ashcan','garbage','studio couch','refrigerator','quilt','sleeping bag','paper towel','toilet tissue','packet','pop bottle','water bottle','beer bottle','wine bottle','water jug','whiskey jug','soap dispenser','washer','dishwasher','microwave','television','monitor','desktop computer','printer','vacuum','toaster','space heater','stove','diaper','running shoe','sandal','clog','hamper','crash helmet','umbrella','pizza','bagel','pretzel','ice lolly']
};
let kindClf=null, kindClfP=null;
function getKindClassifier(){
  if(kindClf) return Promise.resolve(kindClf);
  if(!kindClfP) kindClfP=(async()=>{
    if(window.__kindClassifier){ kindClf=window.__kindClassifier; return kindClf; }
    const {mod,files}=await getVision();
    const c=await mod.ImageClassifier.createFromOptions(files,{baseOptions:{modelAssetPath:KIND_MODEL},runningMode:'IMAGE',maxResults:5});
    kindClf={classify:src=>{ const r=c.classify(src); const cl=r&&r.classifications&&r.classifications[0]; return (cl?cl.categories:[]).map(x=>({name:x.categoryName||x.displayName||'',score:x.score||0})); }};
    return kindClf;
  })().catch(e=>{ kindClfP=null; throw e; });
  return kindClfP;
}
const labelRe=l=>new RegExp('(^|[^a-z])'+l.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z]|$)');
function kindFromLabels(cats){
  for(const c of cats||[]){ if(!(c.score>=0.15)) continue; const n=String(c.name||'').toLowerCase();
    for(const k of ['car','lock','cone','trash']) if(KIND_LABELS[k].some(l=>labelRe(l).test(n))) return {kind:k,label:n,score:c.score}; }
  const top=cats&&cats[0]; return {kind:'poop',label:top?String(top.name||'').toLowerCase():'',score:top?top.score:0};
}
async function detectKind(src){ const c=await getKindClassifier(); return kindFromLabels(await c.classify(src)); }

/* ---------------- the shutter: one record, straight to the map ---------------- */
let post=null; // what the card after the shutter is showing: {c, blob, state, err}
async function onShutter(){
  if(geo.status==='error') geoRetry();
  if(!cam.ok){ $('#fileCam').click(); return; }
  const v=$('#cam'); if(!v.videoWidth){ toast(t('cam_starting')); return; }
  flash();
  try{ const fr=await frameToBlobs(v,v.videoWidth,v.videoHeight); await record(fr,{ts:Date.now(),tsFrom:'now',loc:freshFix(),locFrom:'gps'}); }
  catch(e){ toast(t('t_capture_fail',{e:e.message})); }
}
// The camera-app fallback (no live camera): the photo's own date and GPS when it has them.
async function onFile(file){
  if(!file) return; if(!/^image\//.test(file.type||'')&&!/\.(jpe?g|png|webp|heic)$/i.test(file.name||'')){ toast(t('t_pick_image')); return; }
  let exif={}; try{ exif=parseExif(await file.slice(0,512*1024).arrayBuffer()); }catch(e){ exif={}; }
  try{
    const img=await blobToImage(file); const fr=await frameToBlobs(img,img.naturalWidth,img.naturalHeight);
    const ts=exif.ts||Date.now(), tsFrom=exif.ts?'exif':'now';
    const loc=exif.lat!=null?{lat:exif.lat,lng:exif.lng,acc:null,t:ts}:freshFix();
    await record(fr,{ts,tsFrom,loc,locFrom:exif.lat!=null?'exif':'gps'});
  }catch(e){ toast(t('t_photo_fail',{e:e.message})); }
}
// A record is the photo, when, where and what kind. It is saved at once, then the phone works out the kind,
// blurs any faces and finds the location, all three at the same time, and posts it to the map.
async function record(fr,{ts,tsFrom,loc,locFrom}){
  const c=assignCity({id:uid('c'),ts,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,lat:loc?loc.lat:null,lng:loc?loc.lng:null,acc:loc&&loc.acc!=null?Math.round(loc.acc):null,
    kind:'poop',kindKnown:false,seen:'',src:'camera',tsFrom,locFrom:loc?locFrom:'',thumb:fr.thumb,w:fr.w,h:fr.h,faces:null,created:Date.now(),published:0});
  const p={c,blob:fr.blob,state:'working',err:''}; post=p; showPost(p);
  try{ await dbPut('photos',fr.blob,c.id); await saveRecord(c); }catch(e){ toast(t('t_save_fail',{e:e.message})); closePost(); return; }
  records.unshift(c); renderAll();
  const kindP=Promise.race([detectKind(fr.canvas),wait(3000).then(()=>null)]).then(r=>{ if(r){ c.kind=r.kind; c.seen=r.label; } }).catch(()=>{}).then(()=>{ c.kindKnown=true; renderPost(p); });
  const facesP=Promise.race([detectFaces(fr.canvas),wait(4000).then(()=>undefined)]).then(async boxes=>{ if(!Array.isArray(boxes)) return; c.faces=boxes.length;
    if(boxes.length){ pixelateBoxes(fr.canvas,boxes); const f2=await canvasToBlobs(fr.canvas); await dbPut('photos',f2.blob,c.id); c.thumb=f2.thumb; p.blob=f2.blob; showPostPhoto(p); } }).catch(()=>{});
  const locP=(c.lat!=null?Promise.resolve(null):geoNow()).then(f=>{ if(f&&c.lat==null){ c.lat=f.lat; c.lng=f.lng; c.acc=f.acc!=null?Math.round(f.acc):null; c.locFrom='gps'; assignCity(c); } }).catch(()=>{}).then(()=>renderPost(p));
  await Promise.all([kindP,facesP,locP]);
  await saveRecord(c).catch(()=>{}); renderAll();
  if(c.lat==null) p.state='noloc';
  else if(!settings.cloudOn) p.state='syncoff';
  else { try{ await publishRecord(c); p.state='posted'; }catch(e){ p.state='err'; p.err=e.message; } }
  renderPost(p); renderAll();
  // a face check that could not run yet (model still downloading) finishes later and refreshes the shared photo
  if(c.faces==null) ensureFaces(c).then(()=>{ if(c.published) uploadThumb(c).catch(()=>{}); renderAll(); }).catch(()=>{});
}
function showPost(p){ const img=$('#postImg'); if(img.src&&img.src.startsWith('blob:')) URL.revokeObjectURL(img.src); img.src=URL.createObjectURL(p.blob); renderPost(p); $('#post').hidden=false; }
function showPostPhoto(p){ if(post!==p) return; const img=$('#postImg'); if(img.src&&img.src.startsWith('blob:')) URL.revokeObjectURL(img.src); img.src=URL.createObjectURL(p.blob); }
function renderPost(p){ if(post!==p) return; const c=p.c;
  $('#postKind').innerHTML=c.kindKnown?`${kindHtml(kindOf(c))} <span>${esc(kindName(kindOf(c)))}</span>`:`<span class="spin"></span><span>${esc(t('post_looking'))}</span>`;
  $('#postMeta').innerHTML=`📍 ${c.lat!=null?esc(cityLabel(c)):(p.state==='working'?'<span class="spin"></span>'+esc(t('post_locating')):esc(t('not_set')))}<br>🕒 ${esc(fmtDT(c.ts))}`;
  const st=$('#postStatus'); st.className='post-status'+(p.state==='posted'?' ok':'');
  st.innerHTML=p.state==='working'?`<span class="spin"></span>${esc(t('post_working'))}`:p.state==='posted'?`🌍 ${esc(t('post_posted'))}`:p.state==='noloc'?esc(t('post_noloc')):p.state==='syncoff'?esc(t('post_sync_off')):esc(t('post_err',{e:p.err}));
  $('#postLoc').hidden=p.state!=='noloc'; }
function closePost(){ const img=$('#postImg'); if(img.src&&img.src.startsWith('blob:')) URL.revokeObjectURL(img.src); img.removeAttribute('src'); $('#post').hidden=true; post=null; }
// Set the spot by tapping the map (for a record made without a GPS fix), then post it.
function setSpot(c,ll){ c.lat=+ll.lat.toFixed(6); c.lng=+ll.lng.toFixed(6); c.acc=null; c.locFrom='manual'; assignCity(c);
  saveRecord(c).then(()=>{ renderAll(); toast(t('t_loc_set')); if(settings.cloudOn) publishRecord(c).then(()=>{ toast(t('t_published')); renderAll(); if(detailId===c.id) openDetail(c.id); }).catch(e=>toast(t('t_world_err',{e:e.message}))); }); }

/* ---------------- the map: nothing on it but the shits ---------------- */
let map=null, myLayer=null, worldLayer=null, meMarker=null, worldOn=false, pick=null, mapInited=false, mapCentered=false;
function pinIcon(world,kind,cleared){
  return L.divIcon({className:'',html:`<div class="pin${world?' world':''}${cleared?' cleared':''}">${kindHtml(KINDS[kind]?kind:'poop')}</div>`,iconSize:world?[26,26]:[36,36],iconAnchor:world?[13,13]:[18,18],popupAnchor:[0,world?-14:-18]}); }
function initMap(){
  if(mapInited||!window.L) return; mapInited=true;
  map=L.map('map',{zoomControl:false}).setView([20,0],2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  myLayer=L.layerGroup().addTo(map); worldLayer=L.layerGroup().addTo(map);

  map.on('popupopen',e=>{ const el=e.popup.getElement(); const im=el&&el.querySelector('img[data-thumb]'); if(im){ const id=im.dataset.thumb; im.removeAttribute('data-thumb'); cloudReq('/thumbs/'+encodeURIComponent(id),'GET').then(d=>{ if(typeof d==='string'&&d.startsWith('data:image/')) im.src=d; else im.remove(); }).catch(()=>im.remove()); } });

}
// Street level around you; otherwise your records; otherwise the world.
function focusMap(){ if(geo.fix){ mapCentered=true; map.setView([geo.fix.lat,geo.fix.lng],17,{animate:false}); } else fitToRecords(); }
// Every time the map opens it is the street around you again.
function showMap(){ if(!window.L){ $('#mapOffline').hidden=false; return; } $('#mapOffline').hidden=true; const first=!mapInited; initMap(); if(!first){ renderMarkers(); focusMap(); } setTimeout(()=>map.invalidateSize(),60); if(worldOn&&(!worldCache||Date.now()-worldCache.t>60000)) loadWorld().catch(()=>{}); }
function renderMarkers(){ if(!mapInited) return; myLayer.clearLayers();
  for(const c of records){ if(c.lat==null||c.lng==null) continue; L.marker([c.lat,c.lng],{icon:pinIcon(false,kindOf(c),!!c.published&&isCleared(c.id)),title:kindName(kindOf(c))}).bindPopup(()=>popupHtml(c)).addTo(myLayer); }
}
const whenHtml=ts=>`🕒 ${esc(timeAgo(ts))} · ${esc(fmtDT(ts))}`;
function popupHtml(c){ return `<div class="pop"><img src="${c.thumb}" alt=""><b>${avatarHtml(profile.avatar,'pop-av')}${kindHtml(kindOf(c),'ic-img')} ${esc(kindName(kindOf(c)))}</b><br><small>${esc(t('by',{name:profile.name}))} · 🏙️ ${esc(cityLabel(c))}</small><br><small>${whenHtml(c.ts)}</small><button class="btn sm" onclick="openDetail('${c.id}')">${esc(t('view'))}</button>${c.published?goneHtml(c):''}</div>`; }
function worldPopupHtml(s){ const city=s.city?`${esc(String(s.city))}${s.cc?', '+esc(String(s.cc)):''}`:esc(t('outside')); const k=KINDS[s.kind]?s.kind:'poop';

function fitToRecords(){ if(!mapInited) return; const pts=records.filter(c=>c.lat!=null&&c.lng!=null).map(c=>[c.lat,c.lng]);

function updateMeMarker(){ if(!mapInited||!geo.fix) return; const ll=[geo.fix.lat,geo.fix.lng]; if(!mapCentered){ mapCentered=true; map.setView(ll,17,{animate:false}); } if(!meMarker){ meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="pin me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),interactive:false,zIndexOffset:500}).addTo(map); } else meMarker.setLatLng(ll); }
// Everyone's records on the map, with their "it's gone" confirmations.
async function loadWorld(){
  if(!mapInited||!worldOn) return 0; const list=await fetchWorld(); await fetchClears().catch(()=>{}); if(!worldOn) return 0;
  worldLayer.clearLayers(); const mine=new Set(records.map(c=>c.id)); let n=0; const pts=[];
  for(const s of list){ if(mine.has(s.id)||typeof s.lat!=='number'||typeof s.lng!=='number') continue; n++; pts.push([s.lat,s.lng]); L.marker([s.lat,s.lng],{icon:pinIcon(true,s.kind,isCleared(s.id))}).bindPopup(()=>worldPopupHtml(s)).addTo(worldLayer); }

// "It's gone" confirmations live at clears/{recordId}/{phoneId}. Ten of them mark the spot as cleared.
// You have to be there: a fresh, precise fix within GONE_RADIUS metres of the record.
const GONE_N=10, GONE_RADIUS=60, GONE_ACC=150;
let clearsCache=null;
async function fetchClears(){ if(clearsCache&&Date.now()-clearsCache.t<60000) return clearsCache.map; const all=await cloudReq('/clears'); const m={};
  for(const [id,v] of Object.entries(all||{})){ if(!v||typeof v!=='object') continue; const ts=Object.values(v).filter(x=>typeof x==='number'); m[id]={n:ts.length,last:ts.length?Math.max(...ts):0,mine:!!v[profile.tid]}; }
  clearsCache={t:Date.now(),map:m}; return m; }
const goneInfo=id=>(clearsCache&&clearsCache.map[id])||{n:0,last:0,mine:(profile.gone||[]).includes(id)};
const isCleared=id=>goneInfo(id).n>=GONE_N;
function goneHtml(s){ const g=goneInfo(s.id); if(g.n>=GONE_N) return `<div class="gone cleared">✅ ${esc(t('cleared_on',{date:fmtDate(g.last)}))}</div>`;
  const fix=freshFix(); let btn;
  if(g.mine) btn=`<button class="btn sm" disabled>✓ ${esc(t('gone_already'))}</button>`;
  else if(!fix) btn=`<button class="btn sm" disabled>${esc(t('gone_nofix'))}</button>`;
  else { const d=haversine({lat:fix.lat,lng:fix.lng},{lat:s.lat,lng:s.lng});
    if(fix.acc!=null&&fix.acc>GONE_ACC) btn=`<button class="btn sm" disabled>${esc(t('gone_acc',{n:Math.round(fix.acc)}))}</button>`;
    else if(d>GONE_RADIUS) btn=`<button class="btn sm" disabled>${esc(t('gone_far',{d:Math.round(d)}))}</button>`;
    else btn=`<button class="btn sm primary" onclick="markGone('${esc(s.id)}')">🧹 ${esc(t('gone_btn'))}</button>`; }
  return `<div class="gone"><small>🧹 ${esc(t('gone_q'))} ${esc(t('gone_n',{n:g.n}))}</small>${btn}</div>`; }
async function markGone(id){ const s=(worldCache&&worldCache.list.find(x=>x.id===id))||records.find(c=>c.id===id); if(!s||typeof s.lat!=='number') return;
  const fix=freshFix(); if(!fix){ toast(t('gone_nofix')); return; }
  if(fix.acc!=null&&fix.acc>GONE_ACC){ toast(t('gone_acc',{n:Math.round(fix.acc)})); return; }
  const d=haversine({lat:fix.lat,lng:fix.lng},{lat:s.lat,lng:s.lng}); if(d>GONE_RADIUS){ toast(t('gone_far',{d:Math.round(d)})); return; }
  try{ await cloudReq('/clears/'+encodeURIComponent(id)+'/'+encodeURIComponent(profile.tid),'PUT',Date.now()); }catch(e){ toast(t('t_gone_err',{e:e.message})); return; }
  profile.gone=[...new Set([...(profile.gone||[]),id])]; saveProfile(); if(!clearsCache) clearsCache={t:Date.now(),map:{}};
  const g=clearsCache.map[id]||{n:0,last:0,mine:false}; if(!g.mine){ g.n++; g.mine=true; g.last=Date.now(); } clearsCache.map[id]=g;
  toast(t('t_gone_ok',{n:g.n})); if(map) map.closePopup(); renderMarkers(); if(worldOn) loadWorld().catch(()=>{}); renderAll(); }
window.markGone=markGone;
function pickStart(cb,center){ if(!window.L){ toast(t('t_map_offline')); return; } pick={cb}; $('#mapBanner').hidden=false; showTab('map'); if(center) map.setView(center,17,{animate:false}); else if(geo.fix) map.setView([geo.fix.lat,geo.fix.lng],16,{animate:false}); }

/* ---------------- the shared map (Firebase RTDB via REST) ---------------- */
const cloudBase=()=>settings.cloudUrl.trim().replace(/\/+$/,'')+'/'+(settings.cloudRoot||'mierdasdelmundo').replace(/^\/+|\/+$/g,'');
async function cloudReq(path,method='GET',body){
  if(!/^https:\/\//.test(settings.cloudUrl.trim())) throw new Error(t('e_bad_url'));
  const [p,q]=path.split('?'); const url=cloudBase()+p+'.json'+(q?'?'+q:'');
  const r=await fetch(url,{method,body:body===undefined?undefined:JSON.stringify(body)}).catch(()=>{ throw new Error(t('e_network')); });
  if(!r.ok){ let msg='HTTP '+r.status; try{ const j=await r.json(); if(j&&j.error) msg+=' · '+j.error; }catch(e){} throw new Error(msg); }
  return r.status===204?null:r.json();
}
// What leaves the phone: time, rounded coordinates, city, kind, this phone's id, your name and face, and a small copy of the photo.
async function publishRecord(c){
  if(!settings.cloudOn) throw new Error(t('e_sync_off')); if(c.lat==null||c.lng==null) throw new Error(t('e_no_loc'));
  const s={id:c.id,ts:c.ts,lat:+c.lat.toFixed(4),lng:+c.lng.toFixed(4),city:c.city||null,cc:c.cc||null,kind:kindOf(c),tid:profile.tid,avatar:profile.avatar,trainer:profile.name.slice(0,24),pub:Date.now()};
  await cloudReq('/sightings/'+encodeURIComponent(c.id),'PUT',s);
  await uploadThumb(c).catch(()=>{});
  c.published=Date.now(); await saveRecord(c); worldCache=null;
}
// The photo other people see: faces already blurred. While the face check has not run yet only a tiny copy goes up.
async function uploadThumb(c){ if(!c.thumb) return; const du=Number.isInteger(c.faces)?c.thumb:await shrinkDataUrl(c.thumb,96); await cloudReq('/thumbs/'+encodeURIComponent(c.id),'PUT',du); }
let pendingP=null;
// Records that could not be posted (no connection at the time) go up as soon as they can.
function publishPending(){ if(pendingP||!settings.cloudOn) return pendingP||Promise.resolve();
  pendingP=(async()=>{ let n=0; for(const c of records.filter(c=>!c.published&&c.lat!=null)){ try{ await publishRecord(c); n++; }catch(e){ break; } } if(n) renderAll(); })().finally(()=>{ pendingP=null; }); return pendingP; }
let worldCache=null;
async function fetchWorld(){
  if(worldCache&&Date.now()-worldCache.t<60000) return worldCache.list;
  let all; try{ all=await cloudReq('/sightings?orderBy="ts"&limitToLast=2000'); }catch(e){ all=await cloudReq('/sightings'); }
  const list=Object.values(all||{}).filter(s=>s&&typeof s==='object'&&typeof s.id==='string'&&typeof s.ts==='number').sort((a,b)=>b.ts-a.ts).slice(0,2000);
  worldCache={t:Date.now(),list}; return list;
}

    c.addEventListener('touchstart',e=>{ s=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}:null; },{passive:true});
    c.addEventListener('touchend',e=>{ if(!s) return; const p=e.changedTouches[0], dx=p.clientX-s.x, dy=p.clientY-s.y, dt=Date.now()-s.t; s=null;

  $('#dPublish').addEventListener('click',async()=>{ const c=curDetail(); if(!c) return; try{ $('#dPublish').disabled=true; await publishRecord(c); toast(t('t_published')); renderAll(); openDetail(c.id); }catch(e){ toast(t('t_world_err',{e:e.message})); } finally{ $('#dPublish').disabled=false; } });
  // you
  $('#recList').addEventListener('click',e=>{ const b=e.target.closest('[data-open]'); if(b) openDetail(b.dataset.open); });
  // who are you, once
  $('#setupGrid').addEventListener('click',e=>{ const b=e.target.closest('[data-av]'); if(!b) return; setupAv=b.dataset.av; $$('#setupGrid button').forEach(x=>x.classList.toggle('on',x===b)); $('#setupAv').innerHTML=avatarHtml(setupAv); });
  $('#setupName').addEventListener('input',e=>{ $('#setupOk').disabled=e.target.value.trim().length<2; $('#setupMsg').hidden=true; });
  $('#setupName').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!$('#setupOk').disabled) finishSetup(); });
  $('#setupOk').addEventListener('click',finishSetup);
  $('#mapBannerCancel').addEventListener('click',pickEnd);
  $('#cloudOn').addEventListener('change',e=>{ settings.cloudOn=e.target.checked; saveSettings(); worldOn=settings.cloudOn; worldCache=null; if(settings.cloudOn){ toast(t('t_world_on')); publishPending(); } else if(worldLayer) worldLayer.clearLayers(); renderAll(); });
  $('#langSel').addEventListener('change',e=>setLang(e.target.value));
  $('#btnReset').addEventListener('click',resetAll);
  let installEvt=null; window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; $('#installRow').hidden=false; });
  $('#btnInstall').addEventListener('click',async()=>{ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; $('#installRow').hidden=true; });
  window.addEventListener('appinstalled',()=>{ $('#installRow').hidden=true; toast(t('t_installed')); });
  window.addEventListener('online',()=>publishPending());
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) camStop(); else if(currentTab==='catch') camStart(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('#detail').hidden) closeDetail(); else if(!$('#post').hidden) closePost(); } });
  $('#setup').addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
  const tick=()=>{ const d=new Date(); $('#clock').textContent=`${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; }; tick(); setInterval(tick,1000);
}
window.openDetail=openDetail;
(async function init(){
  lang=detectLang(); applyI18n();
  if(!isPhone()&&!isDev){ showGate(); return; }
  try{ records=(await dbGetAll('captures')).sort((a,b)=>b.ts-a.ts); }catch(e){ records=[]; toast(t('t_storage',{e:e.message}),5000); }
  bindEvents(); applyI18n(); renderAvatar(); renderAll(); showTab('catch'); playIntro().then(()=>{ if(!profile.locked) showSetup(); });
  publishPending();
  if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
